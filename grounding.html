<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rinspace · Grounding</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="grounding.css">
</head>
<body>
  <div class="eyelid"></div>

  <!-- Menu bar inside the top band. Hidden until the rock is clicked. -->
  <div class="top-band">
        <a href="index.html" class="home">Rinspace</a>
    <nav class="menu">
      <span>Sweaters</span>
      <span>Flannels</span>
      <span>Beanies</span>
      <span>Scarves</span>
    </nav>
  </div>

  <!-- The sky: the door to Abundance. It only opens after the rock is clicked. -->
  <a href="abundance.html" class="sky" aria-label="The sky"></a>

  <h1>Grounding</h1>

  <!-- The rock. Click it to reveal the clothes and the menu bar. Placeholder until Rin draws the real one. -->
  <button class="rock" aria-label="The rock">
    <img src="rock.png" alt="">
  </button>

  <!-- The first set of clothes. Hidden until the rock is clicked. -->
  <div class="photo-row">
    <div class="photo-spot">Photo coming soon</div>
    <div class="photo-spot">Photo coming soon</div>
    <div class="photo-spot">Photo coming soon</div>
  </div>

  <script>
    // Click the rock: show the clothes and the menu bar
    document.querySelector(".rock").addEventListener("click", function () {
      document.body.classList.add("revealed");
    });

    // Move the mouse up toward the sky: the light gets brighter, smoothly
    document.addEventListener("mousemove", function (event) {
      if (!document.body.classList.contains("revealed")) return;
      var start = window.innerHeight * 0.75; // light starts to wake here
      var end = window.innerHeight * 0.2;    // full light here
      var near = (start - event.clientY) / (start - end);
      near = Math.max(0, Math.min(1, near));
      document.querySelector(".sky").style.setProperty("--near", near);
    });

    // Mouse leaves the window: the light settles back down
    document.addEventListener("mouseleave", function () {
      document.querySelector(".sky").style.setProperty("--near", 0);
    });

    // Click the sky: the camera tilts up into the light, then go to Abundance
    document.querySelector(".sky").addEventListener("click", function (event) {
      event.preventDefault();
      document.body.classList.add("look-up");
      setTimeout(function () {
        document.body.classList.add("eye-close");
      }, 2000);
      setTimeout(function () {
        window.location.href = "abundance.html";
      }, 3000);
    });

    // Coming back with the Back button: look down again
    window.addEventListener("pageshow", function () {
      document.body.classList.remove("look-up", "eye-close");
    });
  </script>
</body>
</html>
