<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rinspace · Reflection</title>
  <link rel="stylesheet" href="reflection.css">
</head>
<body>
  <!-- The whole beach scene is drawn and moved on this canvas by the script below -->
  <canvas class="scene"></canvas>

  <a href="index.html" class="home">Rinspace</a>
  <h1>Reflection</h1>

  <!-- The leaf is the link to the next page. The script keeps this invisible button sitting on top of the leaf. -->
  <a href="#" class="leaf-link" aria-label="The leaf"></a>

  <script>
    // ---------- Settings you can change ----------
    var nextPage = "";        // the page that comes after Reflection, like "faith.html". Empty = stay here.
    var BIRD_GROUPS = [2, 1, 3];                     // birds flying together: 1 = alone, 2 = a pair, more = a group (each bird has its fish)
    var PHONE_SHOW = 1100;    // on phones: how much of the picture's width fits on screen (2421 = all of it)
    var PHONE_CENTER = 1160;  // on phones: which part of the picture is in the middle (smaller = more lightning on the left)
    var SKY_TOP = 110;        // on computers: during the power effect the view starts this far from the top of the picture
    var CAMERA = "still"; // "still" (Nov 9, Rin) = no camera moves on computers: the whole wide picture the whole time.
    //    // on computers: "lookup" = settle on the leaf, look up to the bolt for the strike, back down; "beach" = stay on the beach and leaf; "full" = whole bolt to leaf, chaos fog on the sides; "hold" = stay on the bolt for the strike, then lower; "tilt" = slowly look up and down
    var TILT_TIME = 22;       // seconds for one slow look up and back down
    var LOOK_UP_AT = 9.6;     // seconds: when the camera starts looking up from the leaf to the top of the bolt
    var LOOK_UP_ZOOM = 1.25;  // how much closer the camera gets to the bolt while looking up (1 = no closer)
    var BLAST_TOP = 60;       // at the blast the camera shows the picture from this far below its top, all the way down to the leaf
    var BLAST_HOLD = 1.0;     // seconds it holds the wide view before easing back in to the leaf
    var BLAST_WIDE = false;   // true = at the blast, zoom out past the picture with white light on the sides
    var CHAOS = 0;            // how thick the chaos fog around the light is (0 = none, 1 = thick)
    var FOG = 0.95;           // how thick the fog is after it clears (only in your marked areas)
    var FOG_BEFORE = 0.85;    // how thick the brain fog is before the lightning clears it
    var CLEAR_AT = 13.5;        // seconds after arriving when the big lightning strike clears the fog

    // ---------- Your art (sizes are in pixels of reflection-bg.jpg) ----------
    var IW = 2421, IH = 1871;           // size of the background picture
    var EDGE_CUT = 70;                  // the last 70 px on the right of reflection-bg.jpg are streaky; the wide picture covers them
    var LEAF_REACT = 2.4;               // how strongly the leaf reacts to the power effect (bigger reads better when the whole picture shows)
    var SIDE = 335;                     // reflection-bg-wide.jpg adds this much on each side (computers show the whole wide picture)
    var HOR = 970;                      // the horizon: the split between sky and ocean
    var LIGHT_X = 790;                  // the lightning and its reflection
    var FOCUS = [805, 520];             // the point on the lightning the fog is pulled toward
    var LEAF_BASE = [1508, 1682];       // where the stem meets the sand
    var LEAF_AT = [1470, 1545];         // top-left corner of reflection-leaf.png
    var SHADOW_AT = [1495, 1660];       // top-left corner of reflection-shadow.png
    // the line where the water meets the sand, from left to right
    var SHORE = [[0, 1862], [200, 1838], [400, 1800], [600, 1762], [800, 1712], [1000, 1660], [1200, 1602],
                 [1400, 1545], [1500, 1520], [1600, 1492], [1800, 1462], [2000, 1442], [2200, 1440], [2421, 1436]];

    var leafLink = document.querySelector(".leaf-link");
    var leafTapAt = -10;
    leafLink.addEventListener("click", function (event) {
      event.preventDefault();
      leafTapAt = lastT;                                   // the leaf flares up...
      setTimeout(function () {
        if (nextPage) window.location.href = nextPage;     // ...then on to the next page
      }, 900);
    });
    var lastT = 0;
    var canvas = document.querySelector("canvas.scene");
    var ctx = canvas.getContext("2d");
    ctx.imageSmoothingQuality = "high";
    var W, H, dpr;

    function shoreY(x) {
      for (var i = 1; i < SHORE.length; i++) {
        if (x <= SHORE[i][0]) {
          var a = SHORE[i - 1], b = SHORE[i], k = (x - a[0]) / (b[0] - a[0]);
          return a[1] + (b[1] - a[1]) * k;
        }
      }
      return SHORE[SHORE.length - 1][1];
    }
    function waterPath(c) {
      c.beginPath();
      c.moveTo(-SIDE, HOR);                          // reaches over the side strips too
      c.lineTo(IW + SIDE, HOR);
      c.lineTo(IW + SIDE, SHORE[SHORE.length - 1][1]);
      for (var i = SHORE.length - 1; i >= 0; i--) c.lineTo(SHORE[i][0], SHORE[i][1]);
      c.lineTo(-SIDE, SHORE[0][1]);
      c.closePath();
    }
    function sandPath(c) {
      c.beginPath();
      c.moveTo(0, SHORE[0][1]);
      for (var i = 1; i < SHORE.length; i++) c.lineTo(SHORE[i][0], SHORE[i][1]);
      c.lineTo(IW, IH);
      c.lineTo(0, IH);
      c.closePath();
    }
    function smooth(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
    function rand(a, b) { return a + Math.random() * (b - a); }

    // ---------- Load the three pictures ----------
    var bg = new Image(), leaf = new Image(), shadow = new Image(), wideBg = new Image();
    var loaded = 0;
    [bg, leaf, shadow, wideBg].forEach(function (img) { img.onload = function () { if (++loaded === 4) start(); }; });
    wideBg.src = "reflection-bg-wide.jpg";
    bg.src = "reflection-bg.jpg";
    leaf.src = "reflection-leaf.png";
    shadow.src = "reflection-shadow.png";

    // ---------- Soft smoky noise, used for the fog ----------
    // three drifting smoke layers, painted as one seamless repeating pattern (no lines where tiles meet)
    var smokePatterns = {};
    function drawSmoke(g, w, h, tS, alphas) {
      [[noiseA, 220, 3, 1], [noiseB, 120, -7, 2.5], [noiseA, 80, 10, -1.5]].forEach(function (L, n) {
        var key = n + (g === smokeX ? "s" : "c");
        if (!smokePatterns[key]) smokePatterns[key] = g.createPattern(L[0], "repeat");
        var pat = smokePatterns[key], k = L[1] / L[0].width;
        pat.setTransform(new DOMMatrix([k, 0, 0, k, (tS * L[2]) % L[1], -(tS * L[3]) % L[1]]));
        g.globalAlpha = alphas[n];
        g.fillStyle = pat;
        g.fillRect(0, 0, w, h);
      });
      g.globalAlpha = 1;
    }

    function makeNoise(size, period, seedShift) {
      var c = document.createElement("canvas");
      c.width = c.height = size;
      var g = c.getContext("2d"), img = g.createImageData(size, size), grids = [];
      for (var o = 0; o < 4; o++) {
        var P = period * Math.pow(2, o), grid = [];
        for (var i = 0; i < P * P; i++) grid.push(Math.random());
        grids.push({ P: P, grid: grid, amp: Math.pow(0.5, o) });
      }
      for (var y = 0; y < size; y++) {
        for (var x = 0; x < size; x++) {
          var v = 0, total = 0;
          grids.forEach(function (gr) {
            var u = x / size * gr.P, w = y / size * gr.P, i = Math.floor(u), j = Math.floor(w);
            var fx = u - i, fy = w - j; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
            var P = gr.P, G = gr.grid;
            var a = G[(j % P) * P + (i % P)], b = G[(j % P) * P + ((i + 1) % P)];
            var cc = G[((j + 1) % P) * P + (i % P)], d = G[((j + 1) % P) * P + ((i + 1) % P)];
            v += (a + (b - a) * fx + (cc - a) * fy + (a - b - cc + d) * fx * fy) * gr.amp;
            total += gr.amp;
          });
          v = Math.max(0, Math.min(1, (v / total - 0.32) / 0.4));
          var p = (y * size + x) * 4;
          img.data[p] = 128; img.data[p + 1] = 128; img.data[p + 2] = 128;  // only its shape is used
          img.data[p + 3] = Math.pow(v, 1.4) * 255;
        }
      }
      g.putImageData(img, 0, 0);
      return c;
    }

    // ---------- Things that move ----------
    var base, fogC, fogX, fogMask, fogTint, noiseA, noiseB, smokeC, smokeX, fullC, fullX, fullMask, softC, softX, softMask;
    var birds = [], glitter = [], motes = [], grains = [], gold = [], foam = [], swells = [];
    var fullDensity, markedDensity, clearNow = 0, skyFill, sandFill, sideL, sideR, chaosC, chaosX, chaosSmoke, chaosSX, chaosTint, chaosMask;
    var PAD = 800;            // how far the chaos fog reaches past the picture's left and right edges
    // 0 = no fog here, 1 = thick fog. x, y are in the sky; fish use the spot of their bird.
    function fogAt(x, y) {
      var fx = Math.max(0, Math.min(fogC.width - 1, Math.round(x / 8)));
      var fy = Math.max(0, Math.min(fogC.height - 1, Math.round(y / 8)));
      var i = (fy * fogC.width + fx) * 4 + 3;
      return (fullDensity[i] / 255) * (1 - clearNow) + (markedDensity[i] / 255) * clearNow;
    }
    var nextFlash = CLEAR_AT, flashAt = -10, flashPower = 1, t0 = null;

    function start() {
      // 1. Bake the extra sand texture into the background once
      base = document.createElement("canvas");
      base.width = IW; base.height = IH;
      var b = base.getContext("2d");
      b.drawImage(bg, 0, 0);
      b.save();
      sandPath(b);
      b.clip();
      // clumps: soft darker patches
      var clump = makeNoise(128, 6);
      b.globalAlpha = 0.1;
      b.globalCompositeOperation = "multiply";
      for (var cx = 0; cx < IW; cx += 192) for (var cy = 1400; cy < IH; cy += 192) b.drawImage(clump, cx, cy, 192, 192);
      b.globalCompositeOperation = "source-over";
      b.globalAlpha = 1;
      // pebbles: lit on the side facing the light, shaded on the other side
      for (var i = 0; i < 900; i++) {
        var px = rand(0, IW), py = rand(1430, IH);
        if (py < shoreY(px) + 8) continue;
        var r = rand(1.2, 4.2) * (0.6 + (py - 1430) / 600);
        b.fillStyle = "rgba(40, 30, 22, 0.35)";
        b.beginPath(); b.ellipse(px + r * 0.5, py + r * 0.4, r, r * 0.7, 0, 0, 7); b.fill();
        var tone = Math.random() < 0.5 ? "150, 120, 95" : "175, 165, 155";
        b.fillStyle = "rgba(" + tone + ", 0.9)";
        b.beginPath(); b.ellipse(px, py, r, r * 0.7, 0, 0, 7); b.fill();
        b.fillStyle = "rgba(255, 240, 215, 0.45)";
        b.beginPath(); b.ellipse(px - r * 0.3, py - r * 0.25, r * 0.4, r * 0.28, 0, 0, 7); b.fill();
      }
      b.restore();

      // 2. Fog: smoke layers, kept inside the marked areas
      noiseA = makeNoise(256, 3);
      noiseB = makeNoise(256, 5);
      fogC = document.createElement("canvas");
      fogC.width = Math.round(IW / 8); fogC.height = Math.round(IH / 8);
      fogX = fogC.getContext("2d");
      // The fog only lives inside the two areas you marked in red. Everything else stays clear.
      var FOG_LEFT = [[0, 0], [380, 0], [500, 160], [560, 290], [591, 388], [543, 432], [506, 477], [452, 521], [397, 543], [326, 566],
                      [271, 588], [217, 632], [185, 677], [158, 721], [108, 766], [50, 810], [0, 835]];
      var FOG_RIGHT = [[1300, 0], [1180, 140], [1120, 290], [1101, 432], [1198, 477], [1291, 521], [1365, 566], [1441, 610], [1502, 655],
                       [1559, 699], [1600, 744], [1654, 788], [1695, 833], [1726, 877], [1752, 922], [1780, 966],
                       [1819, 1011], [1865, 1055], [1906, 1100], [1938, 1144], [1980, 1189], [2032, 1233],
                       [2080, 1278], [2155, 1322], [2253, 1367], [2421, 1385], [2421, 0]];
      var tiny = document.createElement("canvas");                 // drawn small, then stretched: soft edges
      tiny.width = Math.round(IW / 80); tiny.height = Math.round(IH / 80);
      var tm = tiny.getContext("2d");
      tm.fillStyle = "#000";
      [FOG_LEFT, FOG_RIGHT].forEach(function (area) {
        tm.beginPath();
        area.forEach(function (pt, n) { if (n === 0) tm.moveTo(pt[0] / 80, pt[1] / 80); else tm.lineTo(pt[0] / 80, pt[1] / 80); });
        tm.closePath();
        tm.fill();
      });
      fogMask = document.createElement("canvas");
      fogMask.width = fogC.width; fogMask.height = fogC.height;
      var fm = fogMask.getContext("2d");
      fm.drawImage(tiny, 0, 0, fogMask.width, fogMask.height);
      fm.globalCompositeOperation = "destination-out";          // the fog melts away softly near the light
      fm.save();
      fm.translate(LIGHT_X / 8, 0);
      fm.scale(1, 1.6);
      var melt = fm.createRadialGradient(0, 0, 0, 0, 0, 75);
      melt.addColorStop(0, "rgba(0,0,0,1)");
      melt.addColorStop(0.5, "rgba(0,0,0,0.6)");
      melt.addColorStop(1, "rgba(0,0,0,0)");
      fm.fillStyle = melt;
      fm.fillRect(-80, -10, 160, 100);
      fm.restore();

      // the fog takes its colors from your art: a very soft copy of the picture's own dark parts
      var soft = document.createElement("canvas");
      soft.width = Math.round(IW / 64); soft.height = Math.round(IH / 64);
      soft.getContext("2d").drawImage(base, 0, 0, soft.width, soft.height);
      fogTint = document.createElement("canvas");
      fogTint.width = fogC.width; fogTint.height = fogC.height;
      var ft = fogTint.getContext("2d");
      ft.drawImage(soft, 0, 0, fogTint.width, fogTint.height);

      // the chaos around the light: fog along your red curves, reaching past the picture's edges on wide screens
      var CHAOS_LEFT = [[-PAD, 0], [520, 0], [470, 200], [375, 451], [150, 700], [-120, 1000], [-150, 1300], [-60, 1600], [60, IH], [-PAD, IH]];
      var CHAOS_RIGHT = [[1440, 0], [1440, 552], [1800, 690], [2100, 880], [2330, 1114], [2400, 1380], [2390, IH], [IW + PAD, IH], [IW + PAD, 0]];
      var cw = Math.round((IW + 2 * PAD) / 8);
      chaosC = document.createElement("canvas"); chaosC.width = cw; chaosC.height = fogC.height; chaosX = chaosC.getContext("2d");
      chaosSmoke = document.createElement("canvas"); chaosSmoke.width = cw; chaosSmoke.height = fogC.height; chaosSX = chaosSmoke.getContext("2d");
      var ctiny = document.createElement("canvas");
      ctiny.width = Math.round((IW + 2 * PAD) / 80); ctiny.height = Math.round(IH / 80);
      var ctm = ctiny.getContext("2d");
      ctm.fillStyle = "#000";
      [CHAOS_LEFT, CHAOS_RIGHT].forEach(function (area) {
        ctm.beginPath();
        area.forEach(function (pt, n) { var X = (pt[0] + PAD) / 80, Y = pt[1] / 80; if (n === 0) ctm.moveTo(X, Y); else ctm.lineTo(X, Y); });
        ctm.closePath(); ctm.fill();
      });
      chaosMask = document.createElement("canvas"); chaosMask.width = cw; chaosMask.height = fogC.height;
      var cmx = chaosMask.getContext("2d");
      cmx.drawImage(ctiny, 0, 0, cw, chaosMask.height);
      cmx.drawImage(ctiny, 0, 0, cw, chaosMask.height);          // twice: solid in the middle, still soft at the edges
      chaosTint = document.createElement("canvas"); chaosTint.width = cw + 24; chaosTint.height = fogC.height + 24;
      var ctt = chaosTint.getContext("2d");
      ctt.drawImage(soft, 0, 0, 1, soft.height, 0, 0, PAD / 8 + 14, chaosTint.height);                       // left: the art's left edge colors
      ctt.drawImage(soft, soft.width - 1, 0, 1, soft.height, PAD / 8 + IW / 8 + 10, 0, PAD / 8 + 14, chaosTint.height);   // right edge colors
      ctt.drawImage(soft, PAD / 8 + 12, 12, IW / 8, fogC.height);
      ctt.globalCompositeOperation = "multiply";                    // darker and murkier, like the brain fog
      ctt.fillStyle = "rgb(150, 142, 132)";
      ctt.fillRect(0, 0, chaosTint.width, chaosTint.height);
      ctt.globalCompositeOperation = "source-over";

      // the brain fog before the lightning: it fills the whole sky, only the light cuts through
      smokeC = document.createElement("canvas");
      smokeC.width = fogC.width; smokeC.height = fogC.height;
      smokeX = smokeC.getContext("2d");
      fullC = document.createElement("canvas");
      fullC.width = fogC.width; fullC.height = fogC.height;
      fullX = fullC.getContext("2d");
      fullMask = document.createElement("canvas");
      fullMask.width = fogC.width; fullMask.height = fogC.height;
      var um = fullMask.getContext("2d"), hz = HOR / 8;
      var grad = um.createLinearGradient(0, 0, 0, hz + 14);
      grad.addColorStop(0, "rgba(0,0,0,1)");
      grad.addColorStop(0.7, "rgba(0,0,0,0.85)");
      grad.addColorStop(0.93, "rgba(0,0,0,0.3)");
      grad.addColorStop(1, "rgba(0,0,0,0)");            // soft bottom edge, so it never shows a hard line
      um.fillStyle = grad;
      um.fillRect(0, 0, fullMask.width, hz + 14);
      um.globalCompositeOperation = "destination-out";
      um.save();
      um.translate(LIGHT_X / 8, 20);
      um.scale(1, 3.4);
      var hole = um.createRadialGradient(0, 0, 0, 0, 0, 34);
      hole.addColorStop(0, "rgba(0,0,0,0.9)");
      hole.addColorStop(1, "rgba(0,0,0,0)");
      um.fillStyle = hole;
      um.fillRect(-60, -40, 120, 80);
      um.restore();

      // a copy of the fog with soft edges, used while it's pulled in and blasted out
      softC = document.createElement("canvas");
      softC.width = fogC.width; softC.height = fogC.height;
      softX = softC.getContext("2d");
      softMask = document.createElement("canvas");
      softMask.width = fogC.width; softMask.height = fogC.height;
      var sm = softMask.getContext("2d");
      sm.translate(softMask.width / 2, softMask.height / 2);
      sm.scale(softMask.width / 2, softMask.height / 2);
      var edgeFade = sm.createRadialGradient(0, 0, 0, 0, 0, 1);
      edgeFade.addColorStop(0, "rgba(0,0,0,1)");
      edgeFade.addColorStop(0.55, "rgba(0,0,0,1)");
      edgeFade.addColorStop(1, "rgba(0,0,0,0)");
      sm.fillStyle = edgeFade;
      sm.fillRect(-1, -1, 2, 2);

      // how thick the fog is at each spot (before and after it clears), so birds and fish can fade into it
      fullDensity = fullMask.getContext("2d").getImageData(0, 0, fogC.width, fogC.height).data;
      markedDensity = fogMask.getContext("2d").getImageData(0, 0, fogC.width, fogC.height).data;

      // for wide computer screens: the picture's left and right edge colors, stretched outward and fading darker
      function makeSide(fromX, outward) {
        var sc = document.createElement("canvas");
        sc.width = 64; sc.height = Math.round(IH / 24);   // few rows, so it reads as soft color, not streaks
        var sx = sc.getContext("2d");
        sx.imageSmoothingQuality = "high";
        sx.drawImage(base, fromX, 0, 3, IH, 0, 0, sc.width, sc.height);
        var g = sx.createLinearGradient(outward > 0 ? 0 : sc.width, 0, outward > 0 ? sc.width : 0, 0);
        g.addColorStop(0, "rgba(30, 28, 25, 0)");
        g.addColorStop(1, "rgba(30, 28, 25, 0.8)");
        sx.fillStyle = g; sx.fillRect(0, 0, sc.width, sc.height);
        return sc;
      }
      sideL = makeSide(0, -1);
      sideR = makeSide(IW - 10, 1);
      // for phones: fill the space above the picture with more sky, and below it with more sand
      var blur = document.createElement("canvas");
      blur.width = Math.round(IW / 16); blur.height = Math.round(IH / 16);
      blur.getContext("2d").drawImage(base, 0, 0, blur.width, blur.height);
      // skyFill covers picture heights -1600 to +100: mirrored sky above the top edge, melting into the picture below it
      skyFill = document.createElement("canvas");
      skyFill.width = Math.round(IW / 4); skyFill.height = 425;   // 4 picture pixels per canvas pixel
      var sf = skyFill.getContext("2d"), seam = 400;
      sf.save();
      sf.translate(0, seam);
      sf.scale(1, -1);
      sf.drawImage(blur, 0, 0, blur.width, blur.height * 0.6, 0, 0, skyFill.width, seam * 1.0);
      sf.restore();
      sf.drawImage(blur, 0, 0, blur.width, 100 / 16, 0, seam, skyFill.width, 25);
      var dark = sf.createLinearGradient(0, seam, 0, 0);
      dark.addColorStop(0, "rgba(30, 28, 25, 0)");
      dark.addColorStop(0.5, "rgba(30, 28, 25, 0.7)");
      dark.addColorStop(1, "rgba(30, 28, 25, 1)");
      sf.fillStyle = dark;
      sf.fillRect(0, 0, skyFill.width, seam);
      sf.globalCompositeOperation = "destination-in";
      var meltTop = sf.createLinearGradient(0, 0, 0, skyFill.height);
      meltTop.addColorStop(0, "rgba(0,0,0,1)");
      meltTop.addColorStop(seam / skyFill.height, "rgba(0,0,0,1)");
      meltTop.addColorStop(1, "rgba(0,0,0,0)");
      sf.fillStyle = meltTop;
      sf.fillRect(0, 0, skyFill.width, skyFill.height);
      sandFill = document.createElement("canvas");             // more of your sand, tiled with mirrored copies so no seams show
      sandFill.width = IW; sandFill.height = 2400;
      var sd = sandFill.getContext("2d");
      var PX = 1780, PY = 1580, PW = 560, PH = 260;              // a patch of plain sand from the picture
      for (var ty = 0, row = 0; ty < sandFill.height; ty += PH, row++) {
        for (var tx = 0, col = 0; tx < IW; tx += PW, col++) {
          sd.save();
          sd.translate(tx + (col % 2 ? PW : 0), ty + (row % 2 ? PH : 0));
          sd.scale(col % 2 ? -1 : 1, row % 2 ? -1 : 1);
          sd.drawImage(base, PX, PY, PW, PH, 0, 0, PW, PH);
          sd.restore();
        }
      }
      sd.globalCompositeOperation = "destination-in";          // its top edge fades so it melts into the picture
      var melt2 = sd.createLinearGradient(0, 0, 0, 90);
      melt2.addColorStop(0, "rgba(0,0,0,0)");
      melt2.addColorStop(1, "rgba(0,0,0,1)");
      sd.fillStyle = melt2;
      sd.fillRect(0, 0, IW, sandFill.height);
      sd.globalCompositeOperation = "source-over";
      var shade = sd.createLinearGradient(0, 90, 0, sandFill.height);   // a little darker further down
      shade.addColorStop(0, "rgba(40, 32, 26, 0)");
      shade.addColorStop(1, "rgba(40, 32, 26, 0.45)");
      sd.fillStyle = shade;
      sd.fillRect(0, 90, IW, sandFill.height - 90);

      // 3. Birds above the horizon, each with a fish mirrored below it
      // birds come alone, in pairs, and in small groups; each bird has its fish mirrored below, so the groups match
      var gx = rand(-200, 300);
      BIRD_GROUPS.forEach(function (count) {
        var ly = rand(580, 820), sp = rand(46, 68), sz = rand(14, 22);
        for (var m = 0; m < count; m++) {
          var row = Math.ceil(m / 2), side = m % 2 ? -1 : 1;    // pairs fly side by side; groups trail in a loose V
          birds.push({
            x: gx - row * rand(40, 60) + (count === 2 ? m * rand(30, 50) : 0),
            y: ly + (count === 2 ? m * rand(15, 30) : side * row * rand(18, 28)),
            s: sz * rand(0.85, 1.05), speed: sp * rand(0.97, 1.03), flap: rand(5.5, 6.5), ph: rand(0, 6.28)

        }
        gx += (IW + 300) / BIRD_GROUPS.length * rand(0.7, 1.3);
      });
      // 4. Sun glitter on the water under the lightning
      for (var g = 0; g < 150; g++) {
        var gy = rand(HOR + 20, 1720);
        glitter.push({ y: gy, x: LIGHT_X + (Math.random() + Math.random() + Math.random() - 1.5) * (30 + (gy - HOR) * 0.35),
                       w: rand(5, 16), sp: rand(1, 3), ph: rand(0, 6.28) });
      }
      // extra warm glitter across the water, for after the fog clears
      for (var g2 = 0; g2 < 380; g2++) {
        var gy2 = rand(HOR + 15, 1800);
        var spread = 120 + (gy2 - HOR) * 1.1;

                       w: rand(4, 14), sp: rand(0.8, 2.4), ph: rand(0, 6.28), after: true,
                       warm: Math.random() < 0.6 });
      }
      // 5. Sand grains the breeze carries
      // 6. Gold dust on the sand: it appears after the lightning strike and twinkles, bringing the beach to life
      while (gold.length < 130) {

        if (gdy < shoreY(Math.max(0, Math.min(IW, gdx))) + 14) continue;
        gold.push({ x: gdx, y: gdy, r: rand(1.1, 2.0), ph: rand(0, 6.28), sp: rand(0.6, 2.2),
                    wait: rand(0, 2.5) + Math.abs(gdx - 1509) / 900 });   // spreads outward from the leaf
      }
      // 8. Little waves out on the water, each in its own spot with its own timing
      for (var sw = 0; sw < 16; sw++) {
        var swell = { x: rand(150, IW - 150), len: rand(160, 420), lift: rand(120, 420), drift: rand(-40, 40),
                      period: rand(7, 12), ph: rand(0, 12), str: rand(0.7, 1.1), bub: [] };
        var nb = Math.round(swell.len / 4);
        for (var bi = 0; bi < nb; bi++) swell.bub.push({ u: Math.random(), off: (Math.random() - 0.5) * 8, r: rand(1, 2.8),
                                                         ph: rand(0, 6.28), sp: rand(1, 3), gold: Math.random() < 0.12 });
        swells.push(swell);
      }
      // 7. Foam bubbles for the waves' edge
      for (var fo = 0; fo < 700; fo++) foam.push({ x: rand(0, IW), back: Math.pow(Math.random(), 2) * 14,
                                                 r: rand(1.2, 3.6), ph: rand(0, 6.28), sp: rand(1, 3), gold: Math.random() < 0.15 });
      for (var s = 0; s < 40; s++) grains.push({ x: rand(0, IW), y: rand(1480, IH - 10), v: rand(30, 90), ph: rand(0, 6.28) });

      resize();
      window.addEventListener("resize", resize);
      requestAnimationFrame(frame);
    }

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    }

    // Camera: starts close up on the sky and the light, then looks down onto the beach
    function camera(t) {
      var cover = Math.max(W / IW, H / IH);
      var s1 = cover * 1.03;
      var cx1 = Math.max(W / 2 / s1, Math.min(IW - W / 2 / s1, 1150));
      var cy1 = Math.max(H / 2 / s1, IH - 14 - H / 2 / s1);
      // computer, after the strike: the whole wide picture fills the screen (side strips only show once the fog is gone)
      var sW = Math.max(W / (IW + 2 * SIDE), H / (IH - 14));
      var cxW = Math.max(-SIDE + W / 2 / sW, Math.min(IW + SIDE - W / 2 / sW, 1150));
      var cyW = IH - 14 - H / 2 / sW;
      if (CAMERA === "full" && !(W < H && W <= 700)) {   // computer: the whole bolt down to the leaf; the chaos fog fills the sides
        s1 = Math.min(s1, H / (IH - 14 - SKY_TOP));
        cx1 = W / s1 >= IW ? IW / 2 + Math.min(150, (W / s1 - IW) / 2) * 0.4 : Math.max(W / 2 / s1, Math.min(IW - W / 2 / s1, 1150));
        cy1 = IH - 14 - H / 2 / s1;
      }
      if (W < H && W <= 700) {                      // phone screen: frame the leaf looking out at the lightning
        s1 = Math.max(W / PHONE_SHOW, cover * 0.4);
        cx1 = Math.max(W / 2 / s1, Math.min(IW - W / 2 / s1, PHONE_CENTER));
        var view = H / s1, extra = view - IH;        // how much taller the screen is than the picture
        if (extra > 0) {

        } else {

      }
      if (CAMERA === "still" && !(W < H && W <= 700)) return { s: sW, x: cxW, y: cyW };
      var s0 = cover * 2.1;
      var cx0 = Math.max(W / 2 / s0, Math.min(IW - W / 2 / s0, LIGHT_X));
      var cy0 = H / 2 / s0 + 40;
      var k = smooth((t - 1.2) / 7);
      k = k * k * (3 - 2 * k);
      if (CAMERA !== "full" && CAMERA !== "beach" && !(W < H && W <= 700)) {   // computer: hold on the whole bolt for the power effect, then lower to the leaf
        var cyS = Math.min(cy1, Math.max(H / 2 / s1, SKY_TOP + H / 2 / s1));
        if (CAMERA === "lookup") {                     // settle on the leaf, then look up with it to the top of the bolt for the power effect, then back down
          var sB = s0 + (s1 - s0) * k, xB = cx0 + (cx1 - cx0) * k, yB = cy0 + (cy1 - cy0) * k;
          var up1 = smooth((t - LOOK_UP_AT) / 3);
          var sZ = s1 * LOOK_UP_ZOOM;
          var xZ = Math.max(W / 2 / sZ, Math.min(IW - W / 2 / sZ, LIGHT_X + 120));
          var yZ = Math.max(H / 2 / sZ, SKY_TOP + H / 2 / sZ);
          var cam1 = { s: sB + (sZ - sB) * up1, x: xB + (xZ - xB) * up1, y: yB + (yZ - yB) * up1 };
          var d = Math.max(0, Math.min(1, (t - CLEAR_AT - 0.03) / 0.55));
          var out = 1 - Math.pow(1 - d, 3);              // the blast: the camera flies out fast to see everything at once
          if (out <= 0) return cam1;
          var open = smooth((t - CLEAR_AT - 0.03) / 2.2);   // at the strike it opens out to the whole wide picture, and stays there
          return { s: cam1.s + (sW - cam1.s) * open, x: cam1.x + (cxW - cam1.x) * open, y: cam1.y + (cyW - cam1.y) * open };
        }
        if (CAMERA === "tilt") {                       // B: settle on the leaf, then drift slowly up to the top of the bolt and back down
          var u = Math.max(0, t - 8.2);
          var up = 0.5 - 0.5 * Math.cos(2 * Math.PI * u / TILT_TIME);
          var cyB = cy0 + (cy1 - cy0) * k;
          return { s: s0 + (s1 - s0) * k, x: cx0 + (cx1 - cx0) * k, y: cyB + (cyS - cy1) * up };
        }
        var k2 = smooth((t - CLEAR_AT - 1.6) / 5);     // A: hold on the whole bolt through the power effect, then lower to the leaf
        k2 = k2 * k2 * (3 - 2 * k2);
        var cyMid = cy0 + (cyS - cy0) * k;
        return { s: s0 + (s1 - s0) * k, x: cx0 + (cx1 - cx0) * k, y: cyMid + (cy1 - cyMid) * k2 };
      }
      return { s: s0 + (s1 - s0) * k, x: cx0 + (cx1 - cx0) * k, y: cy0 + (cy1 - cy0) * k };
    }

    // draws a mirrored copy of a picture-sized layer's left and right edges over the side strips
    function mirrorSides(img) {
      var c = ctx, sw = img.width * SIDE / IW;
      c.save(); c.scale(-1, 1);
      c.drawImage(img, 0, 0, sw, img.height, 0, 0, SIDE, IH);              // left strip
      c.drawImage(img, img.width - sw, 0, sw, img.height, -IW - SIDE, 0, SIDE, IH);   // right strip
      c.restore();
    }

    function flashLevel(t) {
      var d = t - flashAt;
      if (d < 0 || d > 0.9) return 0;
      if (d < 0.06) return 1;
      if (d < 0.13) return 0.25;
      if (d < 0.22) return 0.85;
      return 0.85 * (1 - (d - 0.22) / 0.68);
    }

    function frame(now) {
      if (t0 === null) t0 = now;
      var t = (now - t0) / 1000;
      lastT = t;
      var cam = camera(t);
      var c = ctx;
      if (t > nextFlash) {
        flashAt = t;
        flashPower = 1.8;                                        // the big strike that clears the fog
        nextFlash = Infinity;                                    // after that, the beach stays peaceful
      }
      var flash = flashLevel(t) * flashPower;
      var clear = smooth((t - CLEAR_AT - 0.05) / 1.4);           // 0 = brain fog, 1 = cleared
      clearNow = clear;

      // --- The power build-up: the fog gets sucked in toward the lightning, then blasts out when it strikes ---
      var pull = Math.max(0, Math.min(1, (t - (CLEAR_AT - 2.4)) / 2.4));
      pull = pull * pull * pull;                                 // slow at first, then faster and faster
      var burst = smooth((t - CLEAR_AT) / 1.1);
      var fogK = 1 - 0.5 * pull + 1.6 * burst;                   // shrinks toward the bolt, then flies outward
      var fogSpin = 0.35 * pull + 0.15 * burst;                  // a slight swirl as it's pulled
      var fogBoost = 1 + 0.5 * pull * (1 - burst);               // thicker while it gathers
      if (t < CLEAR_AT) flash = Math.max(flash, pull * 0.35 * (0.6 + 0.4 * Math.sin(t * 40)));   // the bolt crackles as power builds

        cam.y += (Math.random() - 0.5) * shake;
      }
      if (pull > 0 && clear < 1) {                               // soft-edged copy for the pulled fog
        softX.globalCompositeOperation = "source-over";
        softX.clearRect(0, 0, fogC.width, fogC.height);
        softX.drawImage(fullC, 0, 0);
        softX.globalCompositeOperation = "destination-in";
        softX.drawImage(softMask, 0, 0);
      }
      function drawFullFog(alpha) {                              // still fog fades out as the pulled fog takes over

      function drawFog(img, alpha) {

        c.restore();
      }
      var tS = t + 4 * pull;                                     // the smoke speeds up as it's pulled

      // --- Smoke for the fog: three drifting layers ---
      var fw = fogC.width, fh = fogC.height;
      smokeX.clearRect(0, 0, fw, fh);
      drawSmoke(smokeX, fw, fh, tS, [0.9, 0.75, 0.45]);
      if (clear < 1) {                                          // before: murky fog over the whole sky
        fullX.globalCompositeOperation = "source-over";
        fullX.clearRect(0, 0, fw, fh);
        fullX.drawImage(smokeC, 0, 0);
        fullX.globalCompositeOperation = "source-in";
        fullX.fillStyle = "rgb(92, 86, 78)";
        fullX.fillRect(0, 0, fw, fh);
        fullX.globalCompositeOperation = "destination-in";
        fullX.drawImage(fullMask, 0, 0);
      }
      var breath = Math.sin(t * 1.3);

      c.setTransform(dpr * cam.s, 0, 0, dpr * cam.s, dpr * (W / 2 - cam.x * cam.s), dpr * (H / 2 - cam.y * cam.s));
      var tapSize = Math.max(64, 200 * cam.s);                 // big enough to tap easily with a finger
      leafLink.style.width = leafLink.style.height = tapSize + "px";
      leafLink.style.left = (W / 2 + (1509 - cam.x) * cam.s - tapSize / 2) + "px";
      leafLink.style.top = (H / 2 + (1615 - cam.y) * cam.s - tapSize / 2) + "px";
      var tapGlow = Math.max(0, 1 - (t - leafTapAt) / 0.9);    // the leaf flares when tapped
      c.globalAlpha = 1;
      c.globalCompositeOperation = "source-over";
      var viewTop = cam.y - H / 2 / cam.s, viewBottom = cam.y + H / 2 / cam.s;
      if (viewTop < 0) {                                        // the very top: plain dark sky
        c.fillStyle = "rgb(30, 28, 25)";
        c.fillRect(-SIDE, viewTop - 2, IW + 2 * SIDE, -viewTop + 2);
      }
      var viewLeft = cam.x - W / 2 / cam.s, viewRight = cam.x + W / 2 / cam.s;
      if (viewLeft < -SIDE || viewRight > IW + SIDE) {          // only during the blast: the space beside the picture is filled with its light
        c.fillStyle = "rgb(255, 249, 236)";
        if (viewLeft < -SIDE) c.fillRect(viewLeft - 4, viewTop - 4, -SIDE - viewLeft + 8, viewBottom - viewTop + 8);
        if (viewRight > IW + SIDE) c.fillRect(IW + SIDE - 4, viewTop - 4, viewRight - IW - SIDE + 8, viewBottom - viewTop + 8);
      }
      c.drawImage(wideBg, -SIDE, 0);                            // the widened picture's side strips
      c.drawImage(base, 0, 0, IW - EDGE_CUT, IH, 0, 0, IW - EDGE_CUT, IH);
      if (viewTop < 0) c.drawImage(skyFill, 0, -1600, IW, 1700);   // more sky above the picture
      if (viewBottom > IH - 90) c.drawImage(sandFill, 0, IH - 90);   // more sand below the picture

      waterPath(c);
      c.clip();
      for (var y = HOR + 4; y < 1866; y += 2) {

        var dx = Math.round((Math.sin(y * 0.05 + t * 1.6) * a + Math.sin(y * 0.012 - t * 0.7) * a * 0.7) * 2) / 2;
        c.drawImage(base, 0, y, IW - EDGE_CUT, 2, dx, y, IW - EDGE_CUT, 2);
      }
      // fish: mirror images of the birds, swimming under the water
      birds.forEach(function (bd) {
        var bx = ((bd.x + bd.speed * t) % (IW + 300)) - 150;
        var by = bd.y + Math.sin(t * 0.6 + bd.ph) * 8;
        var fy = 2 * HOR - by;
        var room = shoreY(bx) - fy;
        var vis = Math.max(0, Math.min(1, (room - 20) / 60));
        if (vis <= 0) return;
        var flap = Math.sin(t * bd.flap + bd.ph), s = bd.s;
        c.save();
        c.translate(bx, fy);
        c.globalAlpha = 0.5 * vis * (1 - 0.95 * fogAt(bx, by));   // fades as its bird enters the fog
        c.fillStyle = "#0e3a42";
        c.beginPath(); c.ellipse(0, 0, s * 0.75, s * 0.22, 0, 0, 7); c.fill();
        c.beginPath();
        c.moveTo(-s * 0.6, 0);

        c.restore();

      // before it clears, the brain fog is reflected in the water too
      if (clear < 1) {
        c.save();
        c.translate(0, 2 * HOR);
        c.scale(1, -1);

        c.restore();
      }
      // sun glitter in the light's reflection
      c.globalCompositeOperation = "lighter";
      glitter.forEach(function (gl) {
        if (gl.y > shoreY(gl.x) - 6) return;
        var amount = gl.after ? clear : 0.35 + 0.65 * clear;   // only a little glitter in the fog, lots after
        if (amount <= 0) return;
        var v = Math.pow(Math.max(0, Math.sin(t * gl.sp + gl.ph)), 6) * amount;
        if (v < 0.02) return;
        c.fillStyle = gl.warm ? "rgba(255, 222, 160, " + (0.85 * v) + ")" : "rgba(255, 246, 222, " + (0.8 * v) + ")";
        c.fillRect(gl.x - gl.w / 2 + Math.sin(t + gl.y) * 3, gl.y, gl.w, 2);
      });
      c.restore();

      // --- Waves: swells roll in toward the shore, break, wash up the sand and slide back ---
      var WAVE_TIME = 6.5;                                       // seconds per wave
      var wp = (t / WAVE_TIME) % 1;
      var wash = wp < 0.3 ? 1 - Math.pow(1 - wp / 0.3, 2)        // rushes up the sand quickly...
                          : 1 - smooth((wp - 0.3) / 0.7);        // ...then slides slowly back
      var reach = 80;                                            // how far up the sand a wave runs (picture pixels)
      var waveNo = Math.floor(t / WAVE_TIME);
      function runUp(x) {                                        // each wave runs further in some places than others
        var v = 0.5 + 0.5 * Math.sin(x * 0.006 + waveNo * 2.1) * Math.sin(x * 0.0023 + waveNo * 1.3 + 1);
        return 0.25 + 0.75 * v;
      }
      var ROLL_END = IW;                                         // the waves stay inside your picture, not on the side strips
      // swells: separate little waves of lacy foam that form in different spots, roll in toward the shore and fade
      function edgeFadeX(x) { return Math.max(0, Math.min(1, x / 160, (IW - x) / 160)); }   // waves stay inside your picture
      swells.forEach(function (sw) {
        var q = ((t + sw.ph) / sw.period) % 1;                  // 0 = just forming far out, 1 = reaching the shore
        var env = Math.sin(Math.PI * q);
        if (env < 0.03) return;
        var lift = sw.lift * (1 - q);
        var drift = sw.drift * q;                                // drifts a little sideways as it rolls
        for (var n = 0; n < sw.bub.length; n++) {

          var bx = sw.x + drift + (u - 0.5) * sw.len;
          var taper = Math.sin(Math.PI * u);                     // thin at the ends, fuller in the middle
          var crest = -taper * (6 + 10 * q);                     // a gentle arch, like a wave rising
          var by = shoreY(Math.max(0, Math.min(IW, bx))) - lift + crest + bb.off * (0.4 + q);
          if (by < HOR + 25) continue;

      c.save();
      c.beginPath();
      c.moveTo(0, shoreY(0) - 3);
      for (var i = 0; i < SHORE.length; i++) c.lineTo(SHORE[i][0], SHORE[i][1] - 3);

      c.closePath();
      c.fillStyle = "rgba(70, 120, 125, " + (0.14 + wash * 0.16) + ")";   // the thin sheet of water on the sand
      c.fill();
      c.beginPath();                                             // a clear turquoise rim where the water thins out
      edge.forEach(function (e, n) { if (n === 0) c.moveTo(e[0], e[1]); else c.lineTo(e[0], e[1]); });
      c.strokeStyle = "rgba(150, 215, 210, " + (0.12 + 0.18 * wash) + ")";

        if (fx > IW) continue;

        var fa = (0.25 + 0.55 * wash) * edgeFadeX(fx) * runUp(fx) * lace * (0.6 + 0.4 * Math.sin(t * f.sp + f.ph));
        c.fillStyle = f.gold ? "rgba(255, 236, 190, " + fa + ")" : "rgba(248, 252, 252, " + fa + ")";

        }
        c.shadowBlur = 0;
        c.strokeStyle = "rgba(90, 80, 70, " + (0.18 * wet) + ")";
        c.lineWidth = 4;
        c.stroke();
      }
      c.restore();

      // --- Birds in the sky ---
      c.lineCap = "round";
      birds.forEach(function (bd) {
        var bx = ((bd.x + bd.speed * t) % (IW + 300)) - 150;
        var by = bd.y + Math.sin(t * 0.6 + bd.ph) * 8;
        var flap = Math.sin(t * bd.flap + bd.ph), s = bd.s, wy = -s * 0.45 * flap;
        c.strokeStyle = "rgba(34, 31, 27, " + 0.85 * (1 - 0.95 * fogAt(bx, by)) + ")";   // fades into the fog
        c.lineWidth = s * 0.14;
        c.beginPath();
        c.moveTo(bx - s, by + wy);
        c.quadraticCurveTo(bx - s * 0.45, by + wy * 0.2 - s * 0.25, bx, by);
        c.quadraticCurveTo(bx + s * 0.45, by + wy * 0.2 - s * 0.25, bx + s, by + wy);
        c.stroke();
      });

      // --- Brain fog: murky smoke drifting across the sky ---
      var fogSway = 0.85 + 0.15 * Math.sin(t * 0.25);
      if (clear < 1) {
        drawFullFog(FOG_BEFORE * fogSway * (1 - clear) * fogBoost);
      }
      if (clear > 0) {                                          // after: only your marked areas, in your art's colors
        fogX.globalCompositeOperation = "source-over";
        fogX.clearRect(0, 0, fw, fh);
        fogX.drawImage(smokeC, 0, 0);
        fogX.globalCompositeOperation = "source-in";
        var driftX = Math.sin(t * 0.09) * 9 + Math.sin(t * 0.23) * 3;   // the dark parts drift slowly around
        var driftY = Math.cos(t * 0.07) * 6;
        fogX.drawImage(fogTint, driftX - 12, driftY - 12, fw + 24, fh + 24);
        fogX.globalCompositeOperation = "destination-in";
        fogX.drawImage(fogMask, 0, 0);
        c.globalAlpha = FOG * fogSway * clear;
        c.drawImage(fogC, 0, 0, IW, IH);
        mirrorSides(fogC);                                         // the marked fog reaches into the side strips
      }
      c.globalAlpha = 1;

      // --- Chaos around the light: murky fog along your curves, filling past the picture's edges ---
      if (CHAOS > 0 && (viewLeft < 300 || viewRight > 1500)) {
        var cw2 = chaosC.width, ch2 = chaosC.height;
        chaosSX.clearRect(0, 0, cw2, ch2);
        drawSmoke(chaosSX, cw2, ch2, tS, [1, 0.85, 0.55]);
        chaosX.globalCompositeOperation = "source-over";
        chaosX.clearRect(0, 0, cw2, ch2);
        chaosX.drawImage(chaosSmoke, 0, 0);
        chaosX.globalCompositeOperation = "source-in";
        var cdx = Math.sin(t * 0.09) * 9 + Math.sin(t * 0.23) * 3, cdy = Math.cos(t * 0.07) * 6;
        chaosX.drawImage(chaosTint, cdx - 12, cdy - 12);
        chaosX.globalCompositeOperation = "destination-in";
        chaosX.drawImage(chaosMask, 0, 0);
        c.globalAlpha = CHAOS * fogSway;
        c.drawImage(chaosC, -PAD, 0, IW + 2 * PAD, IH);
        c.globalAlpha = 1;
      }

      // --- Before it clears: a warm haze from the light above and on the water ---
      if (clear < 1) {
        c.globalCompositeOperation = "screen";
        var sun = c.createRadialGradient(LIGHT_X, -80, 0, LIGHT_X, -80, 1000);
        sun.addColorStop(0, "rgba(255, 214, 150, " + (0.32 + 0.06 * Math.sin(t * 0.5)) * (1 - clear) + ")");
        sun.addColorStop(1, "rgba(255, 214, 150, 0)");
        c.fillStyle = sun;
        c.fillRect(-SIDE, 0, IW + 2 * SIDE, IH);
        var pool = c.createRadialGradient(LIGHT_X, 1650, 0, LIGHT_X, 1650, 460);
        pool.addColorStop(0, "rgba(255, 236, 205, " + (0.22 + 0.06 * Math.sin(t * 0.7)) * (1 - clear) + ")");
        pool.addColorStop(1, "rgba(255, 236, 205, 0)");
        c.fillStyle = pool;
        c.fillRect(0, 1100, IW, IH - 1100);
        c.globalCompositeOperation = "source-over";
      }

      // --- Lightning: the bolt flashes, and so does its reflection ---
      if (flash > 0) {
        c.globalCompositeOperation = "lighter";
        c.save();
        c.translate(805, 585); c.scale(0.11, 1);
        var bolt = c.createRadialGradient(0, 0, 0, 0, 0, 430);
        bolt.addColorStop(0, "rgba(255, 252, 235, " + 0.6 * flash + ")");
        bolt.addColorStop(1, "rgba(255, 252, 235, 0)");
        c.fillStyle = bolt; c.fillRect(-430, -430, 860, 860);
        c.restore();
        c.save();
        c.translate(LIGHT_X, 1330); c.scale(0.1, 1);
        var echo = c.createRadialGradient(0, 0, 0, 0, 0, 380);
        echo.addColorStop(0, "rgba(255, 252, 235, " + 0.4 * flash + ")");
        echo.addColorStop(1, "rgba(255, 252, 235, 0)");
        c.fillStyle = echo; c.fillRect(-380, -380, 760, 760);
        c.restore();
        c.globalCompositeOperation = "source-over";
        c.fillStyle = "rgba(255, 250, 235, " + 0.1 * flash * (flashPower > 1 ? 2.5 : 1) + ")";   // the big strike lights up everything
        c.fillRect(-SIDE, 0, IW + 2 * SIDE, IH);
      }
      c.globalCompositeOperation = "source-over";
      var sideOut = Math.max(-SIDE - viewLeft, viewRight - IW - SIDE);
      if (sideOut > 0) {                                         // the blast light melts softly into the picture's edges
        var la = Math.min(1, sideOut / 120), reach = 420;
        c.fillStyle = "rgba(255, 249, 236, " + 0.4 * la + ")";      // the whole picture is still bathed in the blast light
        c.fillRect(-SIDE, viewTop - 4, IW + 2 * SIDE, viewBottom - viewTop + 8);
        c.fillStyle = "rgb(255, 249, 236)";                          // and the space beside it is pure light
        if (viewLeft < -SIDE) c.fillRect(viewLeft - 4, viewTop - 4, -SIDE - viewLeft + 6, viewBottom - viewTop + 8);
        if (viewRight > IW + SIDE) c.fillRect(IW + SIDE - 2, viewTop - 4, viewRight - IW - SIDE + 6, viewBottom - viewTop + 8);
        var eL = c.createLinearGradient(-SIDE, 0, -SIDE + reach, 0);
        eL.addColorStop(0, "rgba(255, 249, 236, " + la + ")"); eL.addColorStop(1, "rgba(255, 249, 236, 0)");
        c.fillStyle = eL; c.fillRect(-SIDE, viewTop - 4, reach, viewBottom - viewTop + 8);
        var eR = c.createLinearGradient(IW + SIDE, 0, IW + SIDE - reach, 0);
        eR.addColorStop(0, "rgba(255, 249, 236, " + la + ")"); eR.addColorStop(1, "rgba(255, 249, 236, 0)");
        c.fillStyle = eR; c.fillRect(IW + SIDE - reach, viewTop - 4, reach, viewBottom - viewTop + 8);
      }

      // --- Gold dust: after the strike it sparkles into the sand and keeps twinkling ---
      if (since > 0.2) {
        c.globalCompositeOperation = "screen";
        gold.forEach(function (gd) {
          var on = Math.max(0, Math.min(1, (since - 0.2 - gd.wait) / 1.2));
          if (on <= 0) return;
          var tw = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(t * gd.sp + gd.ph), 3);   // mostly soft, with bright twinkles
          var a = on * tw;
          var g = c.createRadialGradient(gd.x, gd.y, 0, gd.x, gd.y, gd.r * 2.2);   // a tiny soft glint
          g.addColorStop(0, "rgba(255, 228, 150, " + a + ")");
          g.addColorStop(1, "rgba(240, 190, 90, 0)");
          c.fillStyle = g;
          c.fillRect(gd.x - gd.r * 2.2, gd.y - gd.r * 2.2, gd.r * 4.4, gd.r * 4.4);
          c.fillStyle = "rgba(255, 236, 160, " + a + ")";                          // the bright speck itself
          c.fillRect(gd.x - gd.r * 0.35, gd.y - gd.r * 0.35, gd.r * 0.7, gd.r * 0.7);
        });
        c.globalCompositeOperation = "source-over";
      }

      // --- Sand grains drifting in the breeze ---
      grains.forEach(function (gr) {
        var gx = (gr.x + gr.v * t) % IW, gy = gr.y + Math.sin(t * 3 + gr.ph) * 3;
        if (gy < shoreY(gx) + 10) return;
        c.fillStyle = "rgba(230, 205, 170, " + (0.35 + 0.3 * Math.sin(t * 2 + gr.ph)) + ")";
        c.fillRect(gx, gy, 2.2, 1.6);
      });

      // --- The leaf: our character. Its shadow moves with it ---
      // Power effect on the leaf: it's sucked in toward the lightning, then blown out by the strike and springs back
      var leanIn = LEAF_REACT * -10 * pull * (since > 0 ? Math.exp(-since * 10) : 1) + Math.sin(t * 31) * 1.3 * LEAF_REACT * pull * (since > 0 ? 0 : 1);
      var leanOut = since > 0 ? LEAF_REACT * 17 * (1 - Math.exp(-since * 14)) * Math.exp(-1.4 * since) * Math.cos(since * 5) : 0;
      var leafSize = 1 - 0.08 * LEAF_REACT * pull * (since > 0 ? Math.exp(-since * 10) : 1) + (since > 0 ? 0.14 * LEAF_REACT * (1 - Math.exp(-since * 14)) * Math.exp(-2 * since) : 0);
      var sway = (Math.sin(t * 0.9) * 2.2 + Math.sin(t * 2.3) * 0.6 + flash * 1.5 + leanIn + leanOut) * Math.PI / 180;
      var sunShadow = 0.5 + 0.5 * clear;                // faint and hazy in the fog, deep and real once the light is clear
      c.save();                                       // shadow, stretched long across the sand
      c.translate(LEAF_BASE[0], LEAF_BASE[1]);
      c.rotate(sway * 0.9);
      c.scale((1 + 0.03 * Math.sin(t * 0.4) + flash * 0.06) * (0.92 + 0.08 * clear) * leafSize, 1);
      if (clear < 1) {                                  // in the fog the shadow is soft and spread out
        c.globalAlpha = 0.22 * (1 - clear);
        for (var sb = 0; sb < 4; sb++) {
          var ox = (sb % 2 ? 1 : -1) * 4, oy = (sb < 2 ? 1 : -1) * 3;
          c.drawImage(shadow, SHADOW_AT[0] - LEAF_BASE[0] + ox, SHADOW_AT[1] - LEAF_BASE[1] + oy);
        }
      }
      c.globalAlpha = Math.min(1, (0.85 + 0.15 * flash) * sunShadow);
      c.drawImage(shadow, SHADOW_AT[0] - LEAF_BASE[0], SHADOW_AT[1] - LEAF_BASE[1]);
      c.restore();
      var boltShadow = since > -0.1 ? flashLevel(t) * flashPower : 0;   // the strike throws a long, sharp shadow away from the bolt
      if (boltShadow > 0.02) {
        c.save();
        c.translate(LEAF_BASE[0], LEAF_BASE[1]);
        c.rotate(sway * 0.9 - 0.05);
        c.scale(1.5 + 0.4 * boltShadow, 0.85);
        c.globalAlpha = Math.min(0.7, 0.45 * boltShadow);
        c.drawImage(shadow, SHADOW_AT[0] - LEAF_BASE[0], SHADOW_AT[1] - LEAF_BASE[1]);
        c.restore();
      }

      c.globalCompositeOperation = "screen";            // a living glow around the leaf
      var haloR = 150 * (1 + 0.6 * Math.min(1, flash));   // the glow swells with the strike
      var halo = c.createRadialGradient(1509, 1598, 0, 1509, 1598, haloR);
      halo.addColorStop(0, "rgba(180, 240, 160, " + (0.3 + 0.1 * breath + 0.3 * LEAF_REACT * flash + 0.7 * tapGlow) + ")");
      halo.addColorStop(1, "rgba(180, 240, 160, 0)");
      c.fillStyle = halo;
      c.fillRect(1509 - haloR, 1598 - haloR, haloR * 2, haloR * 2);
      c.globalCompositeOperation = "source-over";

      c.save();                                       // the leaf breathes and sways from its stem
      c.translate(LEAF_BASE[0], LEAF_BASE[1]);
      c.rotate(sway);
      c.scale((1 + 0.02 * breath) * leafSize, (1 + 0.035 * breath) * leafSize);
      c.drawImage(leaf, LEAF_AT[0] - LEAF_BASE[0], LEAF_AT[1] - LEAF_BASE[1]);
      c.globalCompositeOperation = "lighter";
      c.globalAlpha = Math.min(1, 0.12 + 0.1 * breath + 0.3 * flash + 0.6 * tapGlow);
      c.drawImage(leaf, LEAF_AT[0] - LEAF_BASE[0], LEAF_AT[1] - LEAF_BASE[1]);
      c.restore();

      // tiny lights rising from the leaf toward the sky
      if (Math.random() < 0.12) motes.push({ x: rand(1490, 1530), y: rand(1560, 1630), born: t, life: rand(2.5, 4.5), dx: rand(-14, 4) });
      c.globalCompositeOperation = "lighter";
      motes = motes.filter(function (mt) {
        var age = (t - mt.born) / mt.life;
        if (age > 1) return false;
        var a = Math.sin(age * Math.PI) * 0.8;
        c.fillStyle = "rgba(215, 255, 185, " + a + ")";
        c.beginPath();
        c.arc(mt.x + mt.dx * age * 4 + Math.sin(age * 9) * 4, mt.y - age * 120, 1.8, 0, 7);
        c.fill();
        return true;
      });
      c.globalCompositeOperation = "source-over";
      c.globalAlpha = 1;

      // --- Arriving: the cyan light from Abundance fades away ---
      var arrive = 1 - smooth((t - 0.5) / 2.8);
      if (arrive > 0) {
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        var land = c.createRadialGradient(W / 2, H, 0, W / 2, H, Math.max(W, H));
        land.addColorStop(0, "#ffffff");
        land.addColorStop(0.35, "#e6fdff");
        land.addColorStop(0.7, "#7aeaff");
        land.addColorStop(1, "#22c8f0");
        c.globalAlpha = arrive;
        c.fillStyle = land;
        c.fillRect(0, 0, W, H);
        c.globalAlpha = 1;
      }

      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
