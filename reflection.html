<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

<body>
  <!-- The whole beach scene is drawn and moved on this canvas by the script below -->
  <canvas class="scene"></canvas>
  <canvas class="spray"></canvas>  <!-- water running and dripping off the clothing panels, drawn in front of them -->

  <a href="index.html" class="home">Rinspace</a>
  <h1>Reflection</h1>

  <!-- The leaf is the link to the next page. The script keeps this invisible button sitting on top of the leaf. -->
  <a href="#" class="leaf-link" aria-label="The leaf"></a>
  <a href="#" class="bolt-link" aria-label="The lightning: strike again"></a>

  <!-- The Reflection clothes: screens that rise out of the water when the lightning is tapped. Swap in photos later. -->
  <div class="rise" data-x="430" data-y="1300" data-href=""><div class="dress"><div class="face">Photo coming soon</div></div></div>
  <div class="rise" data-x="610" data-y="1360" data-href=""><div class="dress"><div class="face">Photo coming soon</div></div></div>
  <div class="rise" data-x="990" data-y="1360" data-href=""><div class="dress"><div class="face">Photo coming soon</div></div></div>
  <div class="rise" data-x="1170" data-y="1300" data-href=""><div class="dress"><div class="face">Photo coming soon</div></div></div>

  <script>
    // ---------- Settings you can change ----------
    var nextPage = "";        // the page that comes after Reflection, like "faith.html". Empty = stay here.
    var BIRD_GROUPS = [2, 1, 3];                     // birds flying together: 1 = alone, 2 = a pair, more = a group (each bird has its fish)
    var PHONE_SHOW = 1100;    // on phones: how much of the picture's width fits on screen (2421 = all of it)
    var PHONE_CENTER = 1160;  // on phones: which part of the picture is in the middle (smaller = more lightning on the left)
    var SKY_TOP = 110;        // on computers: during the power effect the view starts this far from the top of the picture
    var CAMERA = "still"; // "still" (Nov 9, Rin) = no camera moves on computers: the whole wide picture the whole time.
    //    // on computers: "lookup" = settle on the leaf, look up to the bolt for the strike, back down; "beach" = stay on the beach and leaf; "full" = whole bolt to leaf, chaos fog on the sides; "hold" = stay on the bolt for the strike, then lower; "tilt" = slowly look up and down
    var TILT_TIME = 22;       // seconds for one slow look up and back down
    var LOOK_UP_AT = 9.6;     // seconds: when the camera starts looking up from the leaf to the top of the bolt
    var LOOK_UP_ZOOM = 1.25;  // how much closer the camera gets to the bolt while looking up (1 = no closer)
    var BLAST_TOP = 60;       // at the blast the camera shows the picture from this far below its top, all the way down to the leaf
    var BLAST_HOLD = 1.0;     // seconds it holds the wide view before easing back in to the leaf
    var BLAST_WIDE = false;   // true = at the blast, zoom out past the picture with white light on the sides
    var CHAOS = 0;            // how thick the chaos fog around the light is (0 = none, 1 = thick)
    var FOG = 0.95;           // how thick the fog is after it clears (only in your marked areas)
    var FOG_BEFORE = 0.85;    // how thick the brain fog is before the lightning clears it
    var CLEAR_AT = 6.3;        // seconds after arriving when the big lightning strike clears the fog (Nov 9, Rin: 3 s after the cyan light finishes fading at 3.3 s)
    var PULSE_AT = 0;           // seconds after the lightning strike when the pulse blasts out (Rin: eye, lightning, pulse, cross)
    var CROSS_AT = 1.5;         // seconds after the pulse when the cross starts to glow
    var PULL_TIME = 2.4;        // seconds the fog is pulled in and circles the bolt before the strike

    // ---------- Your art (sizes are in pixels of reflection-bg.jpg) ----------
    var IW = 2421, IH = 1871;           // size of the background picture
    var EDGE_CUT = 70;                  // the last 70 px on the right of reflection-bg.jpg are streaky; the wide picture covers them
    var LEAF_REACT = 2.4;               // how strongly the leaf reacts to the power effect (bigger reads better when the whole picture shows)
    var SIDE = 335;                     // reflection-bg-wide.jpg adds this much on each side (computers show the whole wide picture)
    var HOR = 970;                      // the horizon: the split between sky and ocean
    var LIGHT_X = 790;                  // the lightning and its reflection
    var FOCUS = [805, 520];
    var EYE = [800, 560], EYE_R = 240, EYE_TALL = 1.35;   // (not used now)
    var LEAF_BASE = [1508, 1682];       // where the stem meets the sand
    var LEAF_AT = [1470, 1545];         // top-left corner of reflection-leaf.png
    var SHADOW_AT = [1495, 1660];       // top-left corner of reflection-shadow.png
    // the line where the water meets the sand, from left to right
    var SHORE = [[0, 1862], [200, 1838], [400, 1800], [600, 1762], [800, 1712], [1000, 1660], [1200, 1602],
                 [1400, 1545], [1500, 1520], [1600, 1492], [1800, 1462], [2000, 1442], [2200, 1440], [2421, 1436]];

    var leafLink = document.querySelector(".leaf-link");
    var boltLink = document.querySelector(".bolt-link");      // the lightning bolt: tap it and it strikes again
    var boltTapAt = -10, clothesAt = -1, sinkAt = -1;   // sinkAt: when Back sends the clothes back under the water
    var rises = Array.prototype.slice.call(document.querySelectorAll(".rise"));
    // Choosing a panel (Nov 20, Rin): the view zooms into the panel the customer picks, then goes to its page (data-href on the panel).
    var ZOOM_TIME = 1.6, zooming = false;
    var dim = document.createElement("div");               // the scene softly darkens behind the chosen panel
    dim.style.cssText = "position:fixed;left:-50vw;top:-50vh;width:200vw;height:200vh;background:#1f1c18;opacity:0;transition:opacity 1.6s ease;pointer-events:none;z-index:5";
    document.body.appendChild(dim);
    rises.forEach(function (el) {
      el.addEventListener("click", function (event) {
        event.preventDefault(); event.stopPropagation();
        if (zooming) return;
        zooming = true;
        var b = el.getBoundingClientRect(), cx = b.left + b.width / 2, cy = b.top + b.height / 2;
        var k = Math.min(window.innerWidth / b.width, window.innerHeight / b.height) * 0.94;   // the whole panel fits on screen: a photo is never cut off
        rises.forEach(function (o) { o.firstChild.style.willChange = "auto"; });   // so the photo is redrawn sharp at the new size, not stretched
        if (dim) { dim.style.opacity = "1"; el.style.zIndex = "6"; }
        el.style.webkitMaskImage = el.style.maskImage = "none";   // the whole photo shows, not faded at the water line
        var root = document.body;
        root.style.transformOrigin = cx + "px " + cy + "px";
        root.style.transition = "transform " + ZOOM_TIME + "s cubic-bezier(0.55, 0, 0.35, 1)";
        root.style.transform = "translate(" + (window.innerWidth / 2 - cx) + "px, " + (window.innerHeight / 2 - cy) + "px) scale(" + k + ")";
        setTimeout(function () {
          var href = el.dataset.href;
          if (href) { window.location.href = href; return; }
          setTimeout(function () {                           // no page for this panel yet: zoom back out so the preview can carry on
            root.style.transform = "none";
            if (dim) { dim.style.opacity = "0"; el.style.zIndex = ""; }
            el.style.webkitMaskImage = el.style.maskImage = "";
            setTimeout(function () { root.style.transition = ""; zooming = false; rises.forEach(function (o) { o.firstChild.style.willChange = ""; }); }, ZOOM_TIME * 1000);
          }, 900);
        }, ZOOM_TIME * 1000);
      });
    });
    var CARD_W = 170, CARD_H = 300;   // size of each clothing screen, in picture pixels
    var RIPPLE_SPEED = 1100, IMPACT = [797, 985];   // how fast the ripples spread across the water (picture pixels a second), and where the bolt hits it
    var WAVE_START = 0.55, WAVE_MAX = 6000, WAVE_LIFE = 10.9;   // (Nov 23, Rin: the sea wave and the shore didn't sync) the wave now travels all the way in and lands on the beach, instead of dying out at sea    // (Rin: about a quarter slower than the first version)   // the big wave from the bolt: when it starts, how far it spreads, how long it takes
    // Nov 20 (Rin): L1 = first strike, L2 = the click that strikes again. L2 starts the quill writing; the L2 wave reaches the beach,
    // rushes up over the writing, the water dries 2-3 s later leaving it darker, and the panels rise as the water runs back out to sea.
    var SURGE_UP = 0.8, BACK_AFTER = 3.6, BACK_SPEED = 1400;       // surge rushes up in 0.5 s; the backwash leaves 1.6 s after the wave lands, crossing the water at this speed
    function ellD(x, y) { var dx = x - IMPACT[0], dy = (y - IMPACT[1]) / 0.16; return Math.sqrt(dx * dx + dy * dy); }
    function shoreArrive(x) { return waveDelay(x, shoreY(Math.max(0, Math.min(IW, x)))); }   // seconds after L2 until the wave lands on the beach here
    function riseDelay(el) {                       // each panel rises as the water running back from the shore reaches it
      var x = +el.dataset.x, y = +el.dataset.y;
      return shoreArrive(x) + BACK_AFTER + Math.max(0, ellD(x, shoreY(x)) - ellD(x, y)) / BACK_SPEED;
    }
    function waveDelay(x, y) {                     // seconds after a click until the wave's crest reaches this spot (panels rise, the leaf reacts)
      var dx = x - IMPACT[0], dy = (y - IMPACT[1]) / 0.16;
      var d = Math.min(WAVE_MAX * 0.98, Math.sqrt(dx * dx + dy * dy) / wob(Math.atan2(dy, dx), 0));   // where the first wave's uneven edge reaches it
      var q = 1 - Math.pow(1 - d / WAVE_MAX, 1 / 1.6);           // (the same easing the wave uses)
      return WAVE_START + q * WAVE_LIFE + 0.05;
    }
    function wob(ang, sd) {                        // makes each wave's edge uneven: further out in some places, behind in others
      return 1 + 0.07 * Math.sin(3 * ang + sd * 1.7) + 0.05 * Math.sin(5 * ang + sd * 4.1) + 0.03 * Math.sin(11 * ang + sd * 2.3);
    }
    // your own wave strokes from the sea in reflection-bg.jpg, cut out so they can roll outward from the bolt
    var waveArt = ["a", "b", "c", "d"].map(function (k) { var im = new Image(); im.src = "reflection-wave-" + k + ".png"; return im; });
    function fogFade(x, y) {                       // waves fade into the fog the same way the birds and fish do (Nov 10, Rin)
      return 1 - 0.95 * fogAt(x, 2 * HOR - y);     // water uses the fog at its mirror spot in the sky, like the fish
    }
    var POND = false;
    function backwash(x, y, sTap) {                // the water running back from the beach out to sea, made of your wave strokes (Nov 20, Rin)
      var c = ctx, D0 = ellD(x, shoreY(x)), tb = sTap - shoreArrive(x) - BACK_AFTER;
      if (tb <= 0) return;
      var r = D0 - BACK_SPEED * tb;
      if (r < 60) return;
      var f = Math.min(1, tb / 0.4) * Math.min(1, (r - 60) / 400) * 0.8;
      var pieces = Math.max(3, Math.min(16, Math.round(r / 110)));
      for (var j = 0; j < pieces; j++) {
        var ang = (j + 0.6 * seeded(77 + j)) / pieces * Math.PI;           // only the near half: the water coming back from the beach toward the panels
        var R = r * wob(ang, 9);
        var px = x + Math.cos(ang) * R, py = y + Math.sin(ang) * R * 0.16;
        if (py < HOR + 20) continue;
        var img = waveArt[Math.floor(seeded(91 + j * 3) * 4)];
        if (!img.complete || !img.naturalWidth) continue;
        var near = Math.max(0.35, Math.min(1.6, 0.45 + (py - HOR) / 600));
        var len = Math.min(1, (Math.PI * R / pieces) / img.naturalWidth * 1.1) * near * (0.8 + 0.4 * seeded(5 + j * 5));
        c.save();
        c.globalAlpha = Math.min(1, f * (0.75 + 0.25 * seeded(11 + j))) * fogFade(px, py) * Math.pow(Math.sin(ang), 0.5);
        c.translate(px, py); c.scale(len * (seeded(3 + j) < 0.5 ? -1 : 1), near * 1.3);
        c.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
        c.restore();
      }
      c.globalAlpha = 1;
    }
    var SURGE = 1;                                 // (Nov 20, Rin) the lightning wave rushes far up the sand when it reaches the beach. 0 = off                              // (Nov 19, Rin: like a drop of water into a pond, rings spreading out) false = your wave strokes as before
    function pondRings(x, y, age, maxR, alpha, life, sd) {
      var c = ctx, SEG = 64;
      var waves = [[0, 1, 1], [0.5, 0.7, 0.8], [1.2, 0.5, 0.6]];   // three sets of rings, one after another
      c.lineCap = "round";
      for (var k = 0; k < waves.length; k++) {
        var a2 = age - waves[k][0];
        if (a2 <= 0) continue;
        var ks = sd * 7 + k * 3.3;
        var q = Math.min(1, a2 / life), lead = (1 - Math.pow(1 - q, 1.6)) * maxR * waves[k][2];
        var f = Math.min(1, a2 / 0.2) * Math.pow(Math.max(0, 1 - q), 1.3) * alpha * waves[k][1];
        if (f <= 0.01) continue;
        var gap = (26 + 70 * q) * (maxR / 2600 * 0.7 + 0.3);   // the rings spread apart as they travel
        for (var j = 0; j < 5; j++) {                           // a few rings behind each other, the first one strongest
          var r = lead - j * gap;
          if (r < 4) continue;
          var fj = f * (1 - j * 0.17);
          var prev = null;
          for (var sg = 0; sg <= SEG; sg++) {
            var ang = sg / SEG * 2 * Math.PI;
            var R = r * (1 + 0.3 * (wob(ang, ks) - 1));            // pond rings stay nearly round
            var px = x + Math.cos(ang) * R, py = y + Math.sin(ang) * R * 0.2;
            if (prev) {
              var near = Math.max(0.3, Math.min(1.8, 0.45 + (py - HOR) / 520));   // nearer the viewer = thicker
              var fade = fj * fogFade(px, py);
              if (fade > 0.01) {
                var lw = 2.6 * near;
                c.strokeStyle = "rgba(10, 58, 68, " + Math.min(1, fade * 0.65) + ")";   // the shaded side of the little swell
                c.lineWidth = lw * 1.6;
                c.beginPath(); c.moveTo(prev[0], prev[1] + lw * 1.3); c.lineTo(px, py + lw * 1.3); c.stroke();
                c.strokeStyle = "rgba(244, 250, 246, " + Math.min(1, fade * 0.95) + ")";  // and the light on its top
                c.lineWidth = lw;
                c.beginPath(); c.moveTo(prev[0], prev[1]); c.lineTo(px, py); c.stroke();
              }
            }
            prev = [px, py];
          }
        }
      }
      c.globalAlpha = 1;
    }
    function ripple(x, y, age, maxR, alpha, life, sd) {   // waves rolling out across the water, made of your drawn wave strokes
      if (POND) return pondRings(x, y, age, maxR, alpha, life || 2.6, sd || 0);
      var c = ctx; life = life || 2.6; sd = sd || 0;
      var waves = [[0, 1, 1], [0.5, 0.7, 0.8], [1.2, 0.5, 0.6]];   // each wave: start delay, strength, size: no two alike
      for (var k = 0; k < waves.length; k++) {
        var a2 = age - waves[k][0];
        if (a2 <= 0) continue;
        var ks = sd * 7 + k * 3.3;
        var q = Math.min(1, a2 / life), r = (1 - Math.pow(1 - q, 1.6)) * maxR * waves[k][2];
        var f = Math.min(1, a2 / 0.25) * Math.max(0, 1 - q) * alpha * waves[k][1];
        if (f <= 0.01 || r < 6) continue;
        var pieces = Math.max(3, Math.min(16, Math.round(r / 110)));   // more strokes as the wave spreads wider
        for (var j = 0; j < pieces; j++) {
          var ang = (j + 0.6 * seeded(ks * 13 + j)) / pieces * 2 * Math.PI + ks;
          if (seeded(ks * 29 + j) < 0.22) continue;                   // a few gaps along each wave
          var R = r * wob(ang, ks);
          var px = x + Math.cos(ang) * R, py = y + Math.sin(ang) * R * 0.16;
          var img = waveArt[Math.floor(seeded(ks * 7 + j * 3) * 4)];
          if (!img.complete || !img.naturalWidth) continue;
          var near = Math.max(0.35, Math.min(1.6, 0.45 + (py - HOR) / 600));   // nearer the viewer = bigger
          var len = Math.min(1, (2 * Math.PI * R / pieces) / img.naturalWidth * 1.1) * near * (0.8 + 0.4 * seeded(ks + j * 5));
          var tilt = 0.05 * Math.cos(ang) * (Math.sin(ang) > 0 ? -1 : 1);   // almost flat, like your strokes: just a hint of the curve
          var flip = seeded(ks * 3 + j) < 0.5 ? -1 : 1;
          c.save();
          c.globalAlpha = Math.min(1, f * 1.3 * (0.75 + 0.25 * seeded(ks * 11 + j))) * fogFade(px, py);
          c.translate(px, py); c.rotate(tilt); c.scale(len * flip, near * 1.3);
          c.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
          c.restore();
        }
        var n = Math.min(260, Math.round(r * 0.45) + 10);           // a little lacy foam riding along
        for (var jb = 0; jb < n; jb++) {
          var an2 = (jb + seeded(k * 991 + jb + sd * 50) * 0.8) / n * 2 * Math.PI;
          var lace = 0.5 + 0.5 * Math.sin(an2 * 9 + ks + age * 0.8) * Math.sin(an2 * 4 - age * 0.5 + ks);
          if (lace < 0.35) continue;
          var R2 = r * wob(an2, ks) + (seeded(k * 577 + jb * 3) - 0.6) * 12;
          var bx = x + Math.cos(an2) * R2, by = y + Math.sin(an2) * R2 * 0.16 - 3;
          var br = 1.1 + seeded(k * 313 + jb * 7) * 2;
          c.globalAlpha = 1;
          c.fillStyle = "rgba(226, 236, 236, " + Math.min(1, f * 0.4 * (lace - 0.35) / 0.65) * fogFade(bx, by) + ")";
          c.beginPath(); c.arc(bx, by, br, 0, 6.283); c.fill();
        }
      }
      c.globalAlpha = 1;
    }
    boltLink.addEventListener("click", function (event) {
      event.preventDefault();
      strikeAgain();
    });
    function strikeAgain() {                               // the second lightning: the bolt strikes again and the clothes come up
      if (lastT < CLEAR_AT + 1) return;                    // wait until the first strike is over
      boltTapAt = lastT;                                   // only the bolt itself lights up (Nov 9, Rin)
      if (clothesAt < 0 || sinkAt >= 0) {                  // the first tap brings the clothes up out of the water
        clothesAt = lastT; sinkAt = -1;
        markCalm();                                        // the calm beach becomes its own Back step (made on a click, so browsers keep it)
        history.pushState({ step: "clothes" }, "");        // so the Back button sinks them again (Nov 10, Rin)
        try { sessionStorage.setItem("reflectionSawClothes", "1"); } catch (e) {}   // unlocks the click-to-skip for the rest of this visit
      }
    }
    // Back button (Nov 10, Rin): first Back sinks the clothes and leaves you on the calm beach after the strike.
    // A second Back goes to Abundance. Forward brings the clothes back up with a strike.
    // Before the calm there is one more step: the storm. Back from the calm starts Reflection over from the beginning,
    // and a Back from there goes to Abundance.
    function markCalm() {                                  // add the calm beach as a Back step: only ever inside a click, or the browser skips it
      var st = history.state && history.state.step;
      if (st == "calm" || st == "clothes") return;
      if (st != "storm") history.replaceState({ step: "storm" }, "");   // this entry is the storm
      history.pushState({ step: "calm" }, "");
    }
    // A click anywhere before the strike skips ahead: the fog starts gathering right away and the strike follows (Nov 10, Rin)
    // Only after someone has seen the clothes (this visit), so a first-timer always gets the whole opening.
    document.addEventListener("click", function (event) {
      var on = event.target.closest ? event.target.closest(".bolt-link, .leaf-link, .rise, .home") : null;
      if (!on && lastT > CLEAR_AT + 1) strikeAgain();       // a click anywhere on the screen strikes again, not only on the bolt (Nov 16, Rin)
      if (lastT > CLEAR_AT + 1) markCalm();                 // any click on the calm beach makes it a Back step
      var saw = false; try { saw = sessionStorage.getItem("reflectionSawClothes") == "1"; } catch (e) {}
      if (!saw) return;
      jumpClock(CLEAR_AT - PULL_TIME);
    });
    function jumpClock(to) {                               // move the story's clock forward to this moment
      if (t0 !== null && lastT < to) { t0 -= (to - lastT) * 1000; lastT = to; }
    }
    window.addEventListener("popstate", function () {
      var step = history.state && history.state.step;
      var stormy = lastT < CLEAR_AT;                        // still in the storm, before the strike
      if (step == "clothes") {                              // Forward to the clothes
        if (stormy) { jumpClock(CLEAR_AT - 0.05); boltTapAt = clothesAt = CLEAR_AT + 1.2; sinkAt = -1; }   // strike now, then the clothes come up
        else if (clothesAt < 0 || sinkAt >= 0) { boltTapAt = lastT; clothesAt = lastT; sinkAt = -1; }
      } else if (step == "calm") {
        if (stormy) jumpClock(CLEAR_AT - 0.05);             // Forward from the storm: the strike happens right away
        else if (clothesAt >= 0 && sinkAt < 0) sinkAt = lastT;   // Back from the clothes: they sink
      } else if (!stormy) {                                 // Back from the calm into the storm: start Reflection over
        history.replaceState({ step: "storm" }, "");        // (marked, so the next Back goes on to Abundance)
        location.reload();
      }
    });
    var arrived = history.state && history.state.step;
    if (arrived == "calm" || arrived == "clothes") history.replaceState({ step: "storm" }, "");   // the page always opens in the storm
    var leafTapAt = -10, writeAt = -1;
    // --- The way out to Faith (Nov 12, Rin): the leaf's shadow lifts off the sand like an ink quill and writes a line in the sand ---
    // WRITE_PATH: Rin's Faith line, as the strokes the quill follows (in picture pixels), four rows on the sand right of the leaf.
    // The letter shapes come from the Kalam handwriting font (SIL Open Font License; Nov 16, Rin: easier to read than cursive), thinned to single pen lines. Rin's words, unchanged:

        if (clothesAt >= 0) rises.forEach(function (el) {
          var age = t - clothesAt - riseDelay(el);
          if (age > 0 && age < 5) { var pi2 = rises.indexOf(el) + 1; ripple(+el.dataset.x, +el.dataset.y, age, 240 + 40 * seeded(pi2), 0.6, 2.8, pi2); }   // churned water while it rises
        });
        c.restore();
      }

      // --- Lightning: the bolt flashes, and so does its reflection ---
      if (flash > 0) {
        c.globalCompositeOperation = "lighter";
        c.save();
        c.translate(805, 585); c.scale(0.11, 1);
        var bolt = c.createRadialGradient(0, 0, 0, 0, 0, 430);
        bolt.addColorStop(0, "rgba(255, 252, 235, " + 0.6 * flash + ")");
        bolt.addColorStop(1, "rgba(255, 252, 235, 0)");
        c.fillStyle = bolt; c.fillRect(-430, -430, 860, 860);
        c.restore();
        c.save();
        c.translate(LIGHT_X, 1330); c.scale(0.1, 1);
        var echo = c.createRadialGradient(0, 0, 0, 0, 0, 380);
        echo.addColorStop(0, "rgba(255, 252, 235, " + 0.4 * flash + ")");
        echo.addColorStop(1, "rgba(255, 252, 235, 0)");
        c.fillStyle = echo; c.fillRect(-380, -380, 760, 760);
        c.restore();
        c.globalCompositeOperation = "source-over";
        c.fillStyle = "rgba(255, 250, 235, " + 0.1 * flash * (flashPower > 1 ? 2.5 : 1) + ")";   // the big strike lights up everything
        c.fillRect(-SIDE, 0, IW + 2 * SIDE, IH);
      }
      c.globalCompositeOperation = "source-over";
      var sideOut = Math.max(-SIDE - viewLeft, viewRight - IW - SIDE);
      if (sideOut > 0) {                                         // the blast light melts softly into the picture's edges
        var la = Math.min(1, sideOut / 120), reach = 420;
        c.fillStyle = "rgba(255, 249, 236, " + 0.4 * la + ")";      // the whole picture is still bathed in the blast light
        c.fillRect(-SIDE, viewTop - 4, IW + 2 * SIDE, viewBottom - viewTop + 8);
        c.fillStyle = "rgb(255, 249, 236)";                          // and the space beside it is pure light
        if (viewLeft < -SIDE) c.fillRect(viewLeft - 4, viewTop - 4, -SIDE - viewLeft + 6, viewBottom - viewTop + 8);
        if (viewRight > IW + SIDE) c.fillRect(IW + SIDE - 2, viewTop - 4, viewRight - IW - SIDE + 6, viewBottom - viewTop + 8);
        var eL = c.createLinearGradient(-SIDE, 0, -SIDE + reach, 0);
        eL.addColorStop(0, "rgba(255, 249, 236, " + la + ")"); eL.addColorStop(1, "rgba(255, 249, 236, 0)");
        c.fillStyle = eL; c.fillRect(-SIDE, viewTop - 4, reach, viewBottom - viewTop + 8);
        var eR = c.createLinearGradient(IW + SIDE, 0, IW + SIDE - reach, 0);
        eR.addColorStop(0, "rgba(255, 249, 236, " + la + ")"); eR.addColorStop(1, "rgba(255, 249, 236, 0)");
        c.fillStyle = eR; c.fillRect(IW + SIDE - reach, viewTop - 4, reach, viewBottom - viewTop + 8);
      }

      // --- Gold dust: after the strike it sparkles into the sand and keeps twinkling ---
      if (since > 0.2) {
        c.globalCompositeOperation = "screen";
        gold.forEach(function (gd) {
          var on = Math.max(0, Math.min(1, (since - 0.2 - gd.wait) / 1.2));
          if (on <= 0) return;
          var tw = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(t * gd.sp + gd.ph), 3);   // mostly soft, with bright twinkles
          var a = on * tw;
          var g = c.createRadialGradient(gd.x, gd.y, 0, gd.x, gd.y, gd.r * 2.2);   // a tiny soft glint
          g.addColorStop(0, "rgba(255, 228, 150, " + a + ")");
          g.addColorStop(1, "rgba(240, 190, 90, 0)");
          c.fillStyle = g;
          c.fillRect(gd.x - gd.r * 2.2, gd.y - gd.r * 2.2, gd.r * 4.4, gd.r * 4.4);
          c.fillStyle = "rgba(255, 236, 160, " + a + ")";                          // the bright speck itself
          c.fillRect(gd.x - gd.r * 0.35, gd.y - gd.r * 0.35, gd.r * 0.7, gd.r * 0.7);
        });
        c.globalCompositeOperation = "source-over";
      }

      // --- Sand grains drifting in the breeze ---
      grains.forEach(function (gr) {
        var gx = (gr.x + gr.v * t) % IW, gy = gr.y + Math.sin(t * 3 + gr.ph) * 3;
        if (gy < shoreY(gx) + 10) return;
        c.fillStyle = "rgba(230, 205, 170, " + (0.35 + 0.3 * Math.sin(t * 2 + gr.ph)) + ")";
        c.fillRect(gx, gy, 2.2, 1.6);
      });

      // --- The leaf: our character. Its shadow moves with it ---
      // Power effect on the leaf: it's sucked in toward the lightning, then blown out by the strike and springs back
      var ts = -1;   // a click no longer moves the leaf (Nov 10, Rin: the click is too gentle to move it). Only the big first strike does.
      var tapLean = ts > 0 ? LEAF_REACT * 12 * (1 - Math.exp(-ts * 14)) * Math.exp(-1.4 * ts) * Math.cos(ts * 5) : 0;
      var tapGrow = ts > 0 ? 0.1 * LEAF_REACT * (1 - Math.exp(-ts * 14)) * Math.exp(-2 * ts) : 0;
      var leanIn = LEAF_REACT * -10 * pull * (since > 0 ? Math.exp(-since * 10) : 1) + Math.sin(t * 31) * 1.3 * LEAF_REACT * pull * (since > 0 ? 0 : 1);
      var leanOut = (since > 0 ? LEAF_REACT * 17 * (1 - Math.exp(-since * 14)) * Math.exp(-1.4 * since) * Math.cos(since * 5) : 0) + tapLean;
      var leafSize = 1 - 0.08 * LEAF_REACT * pull * (since > 0 ? Math.exp(-since * 10) : 1) + (since > 0 ? 0.14 * LEAF_REACT * (1 - Math.exp(-since * 14)) * Math.exp(-2 * since) : 0) + tapGrow;
      var sway = (Math.sin(t * 0.9) * 2.2 + Math.sin(t * 2.3) * 0.6 + flash * 1.5 + leanIn + leanOut) * Math.PI / 180;
      var sunShadow = 0.5 + 0.5 * clear;                // faint and hazy in the fog, deep and real once the light is clear
      var wt = writeAt >= 0 ? t - writeAt : -1;          // the quill: how far into the writing we are
      var ST = stages();
      var lift = wt < 0 ? 0 : smooth(wt / LIFT_TIME);
      var washed = wt < 0 ? 0 : smooth((wt - ST.wrote - 0.4) / 1.0);   // once the writing is done, the quill fades away
      var done = wt < 0 ? 0 : Math.max(0, Math.min(1, (wt - LIFT_TIME) / WRITE_TIME));
      if (wt >= 0) drawGroove(c, done * penLen, t);        // the line pressed into the sand so far
      if (wt >= 0) drawSandWater(c, done * penLen, t, boltTapAt > 0 ? t - boltTapAt : -1);   // the L2 surge fills what's written, then it dries darker
      if (wt >= 0 && WATER) drawWater(c, wt, t, ST, cam);                // then the wave, the glowing letters and the spill
      var nib = penAt(done * penLen), ahead = penAt(Math.min(penLen, done * penLen + 30));
      var penAng = -1.2 + 0.18 * Math.max(-1, Math.min(1, (ahead[1] - nib[1]) / 12)) + 0.05 * Math.sin(t * 5);   // held like a pen, tipping with the strokes
      var restX = LEAF_BASE[0], restY = LEAF_BASE[1], restAng = sway * 0.9;
      var restS = (1 + 0.03 * Math.sin(t * 0.4) + flash * 0.06) * (0.92 + 0.08 * clear) * leafSize;
      c.save();                                       // shadow, stretched long across the sand (or lifted into a quill)
      c.translate(restX + (nib[0] - restX) * lift, restY + (nib[1] - (nib[2] === false ? 8 : 0) - restY) * lift - 26 * Math.sin(Math.PI * Math.min(1, wt / LIFT_TIME)) * (wt >= 0 ? 1 : 0));
      c.rotate(restAng + (penAng - restAng) * lift);
      c.scale(restS + (0.85 - restS) * lift, 1 - 0.15 * lift);
      var fold = wt < 0 ? 0 : smooth((wt - LIFT_TIME + 0.35) / 0.6);   // the leaf shape folds shut just as the writing begins (Nov 12, Rin)
      if (fold > 0) {                                  // along its middle line, into a slim quill
        var SPINE = 0.38;                              // the angle of the shadow's middle line in reflection-shadow.png
        c.rotate(SPINE); c.scale(1, 1 - 0.35 * fold); c.rotate(-SPINE);   // only partly shut (Nov 12, Rin: not too skinny)
      }
      if (clear < 1) {                                  // in the fog the shadow is soft and spread out
        c.globalAlpha = 0.22 * (1 - clear);
        for (var sb = 0; sb < 4; sb++) {
          var ox = (sb % 2 ? 1 : -1) * 4, oy = (sb < 2 ? 1 : -1) * 3;
          c.drawImage(shadow, SHADOW_AT[0] - LEAF_BASE[0] + ox, SHADOW_AT[1] - LEAF_BASE[1] + oy);
        }
      }
      c.globalAlpha = Math.min(1, (0.85 + 0.15 * flash) * sunShadow) * (1 - washed);
      c.drawImage(shadow, SHADOW_AT[0] - LEAF_BASE[0] - (NIB[0] - 13) * lift, SHADOW_AT[1] - LEAF_BASE[1] - (NIB[1] - 22) * lift);   // as a quill, its tip sits right on the line
      c.restore();
      var boltShadow = since > -0.1 ? flashLevel(t) * flashPower : 0;   // the strike throws a long, sharp shadow away from the bolt
      if (boltShadow > 0.02) {
        c.save();
        c.translate(LEAF_BASE[0], LEAF_BASE[1]);
        c.rotate(sway * 0.9 - 0.05);
        c.scale(1.5 + 0.4 * boltShadow, 0.85);
        c.globalAlpha = Math.min(0.7, 0.45 * boltShadow);
        c.drawImage(shadow, SHADOW_AT[0] - LEAF_BASE[0], SHADOW_AT[1] - LEAF_BASE[1]);
        c.restore();
      }

      c.globalCompositeOperation = "screen";            // a living glow around the leaf
      var haloR = 150 * (1 + 0.6 * Math.min(1, flash));   // the glow swells with the strike
      var halo = c.createRadialGradient(1509, 1598, 0, 1509, 1598, haloR);
      halo.addColorStop(0, "rgba(180, 240, 160, " + (0.3 + 0.1 * breath + 0.3 * LEAF_REACT * flash + 0.7 * tapGlow + (ts > 0 ? 0.6 * Math.exp(-ts * 2.5) : 0)) + ")");
      halo.addColorStop(1, "rgba(180, 240, 160, 0)");
      c.fillStyle = halo;
      c.fillRect(1509 - haloR, 1598 - haloR, haloR * 2, haloR * 2);
      c.globalCompositeOperation = "source-over";

      c.save();                                       // the leaf breathes and sways from its stem
      c.translate(LEAF_BASE[0], LEAF_BASE[1]);
      c.rotate(sway);
      c.scale((1 + 0.02 * breath) * leafSize, (1 + 0.035 * breath) * leafSize);
      c.drawImage(leaf, LEAF_AT[0] - LEAF_BASE[0], LEAF_AT[1] - LEAF_BASE[1]);
      c.globalCompositeOperation = "lighter";
      c.globalAlpha = Math.min(1, 0.12 + 0.1 * breath + 0.3 * flash + 0.6 * tapGlow);
      c.drawImage(leaf, LEAF_AT[0] - LEAF_BASE[0], LEAF_AT[1] - LEAF_BASE[1]);
      c.restore();

      // tiny lights rising from the leaf toward the sky
      if (Math.random() < 0.12) motes.push({ x: rand(1490, 1530), y: rand(1560, 1630), born: t, life: rand(2.5, 4.5), dx: rand(-14, 4) });
      c.globalCompositeOperation = "lighter";
      motes = motes.filter(function (mt) {
        var age = (t - mt.born) / mt.life;
        if (age > 1) return false;
        var a = Math.sin(age * Math.PI) * 0.8;
        c.fillStyle = "rgba(215, 255, 185, " + a + ")";
        c.beginPath();
        c.arc(mt.x + mt.dx * age * 4 + Math.sin(age * 9) * 4, mt.y - age * 120, 1.8, 0, 7);
        c.fill();
        return true;
      });
      c.globalCompositeOperation = "source-over";
      c.globalAlpha = 1;

      // --- Leaving: the spilled water floods the screen from the bottom right corner (the way into the next page) ---
      if (writeAt >= 0) {
        var STf = stages(), wtf = t - writeAt;
        var fl = smooth((wtf - STf.flood) / FLOOD_TIME) * (nextPage ? 1 : 1 - smooth((wtf - STf.end - 1.2) / 1.5));   // preview with no next page yet: it drains away again
        if (fl > 0) {
          c.setTransform(dpr, 0, 0, dpr, 0, 0);
          var R = Math.hypot(W, H) * 2.1 * fl;
          var sea = c.createRadialGradient(W, H, 0, W, H, Math.max(1, R));
          sea.addColorStop(0, "rgba(14, 110, 122, 1)");
          sea.addColorStop(0.5, "rgba(24, 118, 152, 0.97)");
          sea.addColorStop(1, "rgba(24, 118, 152, 0)");             // a long soft edge, no hard rim
          c.fillStyle = sea; c.fillRect(0, 0, W, H);
        }
        if (!nextPage && WATER && wtf > STf.end + 2.8) writeAt = -1;     // preview: ready to click the leaf again
      }

      // --- Arriving: the cyan light from Abundance fades away ---
      var arrive = 1 - smooth((t - 0.5) / 2.8);
      if (arrive > 0) {
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        var land = c.createRadialGradient(W / 2, H, 0, W / 2, H, Math.max(W, H));
        land.addColorStop(0, "#ffffff");
        land.addColorStop(0.35, "#e6fdff");
        land.addColorStop(0.7, "#7aeaff");
        land.addColorStop(1, "#22c8f0");
        c.globalAlpha = arrive;
        c.fillStyle = land;
        c.fillRect(0, 0, W, H);
        c.globalAlpha = 1;
      }

      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
