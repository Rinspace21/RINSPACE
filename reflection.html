<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rinspace · Reflection</title>

<body>
  <!-- The whole beach scene is drawn and moved on this canvas by the script below -->
  <canvas class="scene"></canvas>
  <canvas class="spray"></canvas>  <!-- water running and dripping off the clothing panels, drawn in front of them -->

  <a href="index.html" class="home">Rinspace</a>
  <h1>Reflection</h1>

  <!-- The leaf is the link to the next page. The script keeps this invisible button sitting on top of the leaf. -->
  <a href="#" class="leaf-link" aria-label="The leaf"></a>
  <a href="#" class="bolt-link" aria-label="The lightning: strike again"></a>

  <!-- The Reflection clothes: screens that rise out of the water when the lightning is tapped. Swap in photos later. -->
  <div class="rise" data-x="430" data-y="1300"><div class="dress"><div class="face">Photo coming soon</div></div></div>
  <div class="rise" data-x="610" data-y="1360"><div class="dress"><div class="face">Photo coming soon</div></div></div>
  <div class="rise" data-x="990" data-y="1360"><div class="dress"><div class="face">Photo coming soon</div></div></div>
  <div class="rise" data-x="1170" data-y="1300"><div class="dress"><div class="face">Photo coming soon</div></div></div>

  <script>
    // ---------- Settings you can change ----------
    var nextPage = "";        // the page that comes after Reflection, like "faith.html". Empty = stay here.
    var BIRD_GROUPS = [2, 1, 3];                     // birds flying together: 1 = alone, 2 = a pair, more = a group (each bird has its fish)
    var PHONE_SHOW = 1100;    // on phones: how much of the picture's width fits on screen (2421 = all of it)
    var PHONE_CENTER = 1160;  // on phones: which part of the picture is in the middle (smaller = more lightning on the left)
    var SKY_TOP = 110;        // on computers: during the power effect the view starts this far from the top of the picture
    var CAMERA = "still"; // "still" (Nov 9, Rin) = no camera moves on computers: the whole wide picture the whole time.
    //    // on computers: "lookup" = settle on the leaf, look up to the bolt for the strike, back down; "beach" = stay on the beach and leaf; "full" = whole bolt to leaf, chaos fog on the sides; "hold" = stay on the bolt for the strike, then lower; "tilt" = slowly look up and down
    var TILT_TIME = 22;       // seconds for one slow look up and back down
    var LOOK_UP_AT = 9.6;     // seconds: when the camera starts looking up from the leaf to the top of the bolt
    var LOOK_UP_ZOOM = 1.25;  // how much closer the camera gets to the bolt while looking up (1 = no closer)
    var BLAST_TOP = 60;       // at the blast the camera shows the picture from this far below its top, all the way down to the leaf
    var BLAST_HOLD = 1.0;     // seconds it holds the wide view before easing back in to the leaf
    var BLAST_WIDE = false;   // true = at the blast, zoom out past the picture with white light on the sides
    var CHAOS = 0;            // how thick the chaos fog around the light is (0 = none, 1 = thick)
    var FOG = 0.95;           // how thick the fog is after it clears (only in your marked areas)
    var FOG_BEFORE = 0.85;    // how thick the brain fog is before the lightning clears it
    var CLEAR_AT = 6.3;        // seconds after arriving when the big lightning strike clears the fog (Nov 9, Rin: 3 s after the cyan light finishes fading at 3.3 s)
    var PULSE_AT = 0;           // seconds after the lightning strike when the pulse blasts out (Rin: eye, lightning, pulse, cross)
    var CROSS_AT = 1.5;         // seconds after the pulse when the cross starts to glow
    var PULL_TIME = 2.4;        // seconds the fog is pulled in and circles the bolt before the strike

    // ---------- Your art (sizes are in pixels of reflection-bg.jpg) ----------
    var IW = 2421, IH = 1871;           // size of the background picture
    var EDGE_CUT = 70;                  // the last 70 px on the right of reflection-bg.jpg are streaky; the wide picture covers them
    var LEAF_REACT = 2.4;               // how strongly the leaf reacts to the power effect (bigger reads better when the whole picture shows)
    var SIDE = 335;                     // reflection-bg-wide.jpg adds this much on each side (computers show the whole wide picture)
    var HOR = 970;                      // the horizon: the split between sky and ocean
    var LIGHT_X = 790;                  // the lightning and its reflection
    var FOCUS = [805, 520];
    var EYE = [800, 560], EYE_R = 240, EYE_TALL = 1.35;   // (not used now)
    var LEAF_BASE = [1508, 1682];       // where the stem meets the sand
    var LEAF_AT = [1470, 1545];         // top-left corner of reflection-leaf.png
    var SHADOW_AT = [1495, 1660];       // top-left corner of reflection-shadow.png
    // the line where the water meets the sand, from left to right
    var SHORE = [[0, 1862], [200, 1838], [400, 1800], [600, 1762], [800, 1712], [1000, 1660], [1200, 1602],
                 [1400, 1545], [1500, 1520], [1600, 1492], [1800, 1462], [2000, 1442], [2200, 1440], [2421, 1436]];

    var leafLink = document.querySelector(".leaf-link");
    var boltLink = document.querySelector(".bolt-link");      // the lightning bolt: tap it and it strikes again
    var boltTapAt = -10, clothesAt = -1, sinkAt = -1;   // sinkAt: when Back sends the clothes back under the water
    var rises = Array.prototype.slice.call(document.querySelectorAll(".rise"));
    var CARD_W = 170, CARD_H = 300;   // size of each clothing screen, in picture pixels
    var RIPPLE_SPEED = 1100, IMPACT = [797, 985];   // how fast the ripples spread across the water (picture pixels a second), and where the bolt hits it
    var WAVE_START = 0.55, WAVE_MAX = 2600, WAVE_LIFE = 4.5;    // (Rin: about a quarter slower than the first version)   // the big wave from the bolt: when it starts, how far it spreads, how long it takes
    function riseDelay(el) { return waveDelay(+el.dataset.x, +el.dataset.y); }
    function waveDelay(x, y) {                     // seconds after a click until the wave's crest reaches this spot (panels rise, the leaf reacts)
      var dx = x - IMPACT[0], dy = (y - IMPACT[1]) / 0.16;
      var d = Math.min(WAVE_MAX * 0.98, Math.sqrt(dx * dx + dy * dy) / wob(Math.atan2(dy, dx), 0));   // where the first wave's uneven edge reaches it
      var q = 1 - Math.pow(1 - d / WAVE_MAX, 1 / 1.6);           // (the same easing the wave uses)
      return WAVE_START + q * WAVE_LIFE + 0.05;
    }
    function wob(ang, sd) {                        // makes each wave's edge uneven: further out in some places, behind in others
      return 1 + 0.07 * Math.sin(3 * ang + sd * 1.7) + 0.05 * Math.sin(5 * ang + sd * 4.1) + 0.03 * Math.sin(11 * ang + sd * 2.3);
    }
    // your own wave strokes from the sea in reflection-bg.jpg, cut out so they can roll outward from the bolt
    var waveArt = ["a", "b", "c", "d"].map(function (k) { var im = new Image(); im.src = "reflection-wave-" + k + ".png"; return im; });
    function fogFade(x, y) {                       // waves fade into the fog the same way the birds and fish do (Nov 10, Rin)
      return 1 - 0.95 * fogAt(x, 2 * HOR - y);     // water uses the fog at its mirror spot in the sky, like the fish
    }
    function ripple(x, y, age, maxR, alpha, life, sd) {   // waves rolling out across the water, made of your drawn wave strokes
      var c = ctx; life = life || 2.6; sd = sd || 0;
      var waves = [[0, 1, 1], [0.5, 0.7, 0.8], [1.2, 0.5, 0.6]];   // each wave: start delay, strength, size: no two alike
      for (var k = 0; k < waves.length; k++) {
        var a2 = age - waves[k][0];
        if (a2 <= 0) continue;
        var ks = sd * 7 + k * 3.3;
        var q = Math.min(1, a2 / life), r = (1 - Math.pow(1 - q, 1.6)) * maxR * waves[k][2];
        var f = Math.min(1, a2 / 0.25) * Math.max(0, 1 - q) * alpha * waves[k][1];
        if (f <= 0.01 || r < 6) continue;
        var pieces = Math.max(3, Math.min(16, Math.round(r / 110)));   // more strokes as the wave spreads wider
        for (var j = 0; j < pieces; j++) {
          var ang = (j + 0.6 * seeded(ks * 13 + j)) / pieces * 2 * Math.PI + ks;
          if (seeded(ks * 29 + j) < 0.22) continue;                   // a few gaps along each wave
          var R = r * wob(ang, ks);
          var px = x + Math.cos(ang) * R, py = y + Math.sin(ang) * R * 0.16;
          var img = waveArt[Math.floor(seeded(ks * 7 + j * 3) * 4)];
          if (!img.complete || !img.naturalWidth) continue;
          var near = Math.max(0.35, Math.min(1.6, 0.45 + (py - HOR) / 600));   // nearer the viewer = bigger
          var len = Math.min(1, (2 * Math.PI * R / pieces) / img.naturalWidth * 1.1) * near * (0.8 + 0.4 * seeded(ks + j * 5));
          var tilt = 0.05 * Math.cos(ang) * (Math.sin(ang) > 0 ? -1 : 1);   // almost flat, like your strokes: just a hint of the curve
          var flip = seeded(ks * 3 + j) < 0.5 ? -1 : 1;
          c.save();
          c.globalAlpha = Math.min(1, f * 1.3 * (0.75 + 0.25 * seeded(ks * 11 + j))) * fogFade(px, py);
          c.translate(px, py); c.rotate(tilt); c.scale(len * flip, near * 1.3);
          c.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
          c.restore();
        }
        var n = Math.min(260, Math.round(r * 0.45) + 10);           // a little lacy foam riding along
        for (var jb = 0; jb < n; jb++) {
          var an2 = (jb + seeded(k * 991 + jb + sd * 50) * 0.8) / n * 2 * Math.PI;
          var lace = 0.5 + 0.5 * Math.sin(an2 * 9 + ks + age * 0.8) * Math.sin(an2 * 4 - age * 0.5 + ks);
          if (lace < 0.35) continue;
          var R2 = r * wob(an2, ks) + (seeded(k * 577 + jb * 3) - 0.6) * 12;
          var bx = x + Math.cos(an2) * R2, by = y + Math.sin(an2) * R2 * 0.16 - 3;
          var br = 1.1 + seeded(k * 313 + jb * 7) * 2;
          c.globalAlpha = 1;
          c.fillStyle = "rgba(226, 236, 236, " + Math.min(1, f * 0.4 * (lace - 0.35) / 0.65) * fogFade(bx, by) + ")";
          c.beginPath(); c.arc(bx, by, br, 0, 6.283); c.fill();
        }
      }
      c.globalAlpha = 1;
    }
    boltLink.addEventListener("click", function (event) {
      event.preventDefault();
      if (lastT < CLEAR_AT + 1) return;                    // wait until the first strike is over
      boltTapAt = lastT;                                   // only the bolt itself lights up (Nov 9, Rin)
      if (clothesAt < 0 || sinkAt >= 0) {                  // the first tap brings the clothes up out of the water
        clothesAt = lastT; sinkAt = -1;
        markCalm();                                        // the calm beach becomes its own Back step (made on a click, so browsers keep it)
        history.pushState({ step: "clothes" }, "");        // so the Back button sinks them again (Nov 10, Rin)
        try { sessionStorage.setItem("reflectionSawClothes", "1"); } catch (e) {}   // unlocks the click-to-skip for the rest of this visit
      }
    });
    // Back button (Nov 10, Rin): first Back sinks the clothes and leaves you on the calm beach after the strike.
    // A second Back goes to Abundance. Forward brings the clothes back up with a strike.
    // Before the calm there is one more step: the storm. Back from the calm starts Reflection over from the beginning,
    // and a Back from there goes to Abundance.
    function markCalm() {                                  // add the calm beach as a Back step: only ever inside a click, or the browser skips it
      var st = history.state && history.state.step;
      if (st == "calm" || st == "clothes") return;
      if (st != "storm") history.replaceState({ step: "storm" }, "");   // this entry is the storm
      history.pushState({ step: "calm" }, "");
    }
    // A click anywhere before the strike skips ahead: the fog starts gathering right away and the strike follows (Nov 10, Rin)
    // Only after someone has seen the clothes (this visit), so a first-timer always gets the whole opening.
    document.addEventListener("click", function () {
      if (lastT > CLEAR_AT + 1) markCalm();                 // any click on the calm beach makes it a Back step
      var saw = false; try { saw = sessionStorage.getItem("reflectionSawClothes") == "1"; } catch (e) {}
      if (!saw) return;
      jumpClock(CLEAR_AT - PULL_TIME);
    });
    function jumpClock(to) {                               // move the story's clock forward to this moment
      if (t0 !== null && lastT < to) { t0 -= (to - lastT) * 1000; lastT = to; }
    }
    window.addEventListener("popstate", function () {
      var step = history.state && history.state.step;
      var stormy = lastT < CLEAR_AT;                        // still in the storm, before the strike
      if (step == "clothes") {                              // Forward to the clothes
        if (stormy) { jumpClock(CLEAR_AT - 0.05); boltTapAt = clothesAt = CLEAR_AT + 1.2; sinkAt = -1; }   // strike now, then the clothes come up
        else if (clothesAt < 0 || sinkAt >= 0) { boltTapAt = lastT; clothesAt = lastT; sinkAt = -1; }
      } else if (step == "calm") {
        if (stormy) jumpClock(CLEAR_AT - 0.05);             // Forward from the storm: the strike happens right away
        else if (clothesAt >= 0 && sinkAt < 0) sinkAt = lastT;   // Back from the clothes: they sink
      } else if (!stormy) {                                 // Back from the calm into the storm: start Reflection over
        history.replaceState({ step: "storm" }, "");        // (marked, so the next Back goes on to Abundance)
        location.reload();
      }
    });
    var arrived = history.state && history.state.step;
    if (arrived == "calm" || arrived == "clothes") history.replaceState({ step: "storm" }, "");   // the page always opens in the storm
    var leafTapAt = -10;
    leafLink.addEventListener("click", function (event) {
      event.preventDefault();
      leafTapAt = lastT;                                   // the leaf flares up...
      setTimeout(function () {
        if (nextPage) window.location.href = nextPage;     // ...then on to the next page
      }, 900);
    });
    var lastT = 0;
    var canvas = document.querySelector("canvas.scene");
    var ctx = canvas.getContext("2d");
    var sprayC = document.querySelector("canvas.spray"), sprayX = sprayC.getContext("2d");
    var drops = [], lastFrame = 0;                       // the water drops falling off the panels
    ctx.imageSmoothingQuality = "high";
    var W, H, dpr;

    function shoreY(x) {
      for (var i = 1; i < SHORE.length; i++) {
        if (x <= SHORE[i][0]) {
          var a = SHORE[i - 1], b = SHORE[i], k = (x - a[0]) / (b[0] - a[0]);
          return a[1] + (b[1] - a[1]) * k;
        }
      }
      return SHORE[SHORE.length - 1][1];
    }
    function waterPath(c) {
      c.beginPath();
      c.moveTo(-SIDE, HOR);                          // reaches over the side strips too
      c.lineTo(IW + SIDE, HOR);
      c.lineTo(IW + SIDE, SHORE[SHORE.length - 1][1]);
      for (var i = SHORE.length - 1; i >= 0; i--) c.lineTo(SHORE[i][0], SHORE[i][1]);
      c.lineTo(-SIDE, SHORE[0][1]);
      c.closePath();
    }
    function sandPath(c) {
      c.beginPath();
      c.moveTo(0, SHORE[0][1]);
      for (var i = 1; i < SHORE.length; i++) c.lineTo(SHORE[i][0], SHORE[i][1]);
      c.lineTo(IW, IH);
      c.lineTo(0, IH);
      c.closePath();
    }
    function smooth(x) { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); }
    function rand(a, b) { return a + Math.random() * (b - a); }

    // ---------- Load the three pictures ----------
    var bg = new Image(), leaf = new Image(), shadow = new Image(), wideBg = new Image();
    var loaded = 0;
    [bg, leaf, shadow, wideBg].forEach(function (img) { img.onload = function () { if (++loaded === 4) start(); }; });
    wideBg.src = "reflection-bg-wide.jpg";
    bg.src = "reflection-bg.jpg";
    leaf.src = "reflection-leaf.png";
    shadow.src = "reflection-shadow.png";

    // ---------- Soft smoky noise, used for the fog ----------
    // three drifting smoke layers, painted as one seamless repeating pattern (no lines where tiles meet)
    var smokePatterns = {};
    function drawSmoke(g, w, h, tS, alphas) {
      [[noiseA, 220, 3, 1], [noiseB, 120, -7, 2.5], [noiseA, 80, 10, -1.5]].forEach(function (L, n) {
        var key = n + (g === smokeX ? "s" : "c");
        if (!smokePatterns[key]) smokePatterns[key] = g.createPattern(L[0], "repeat");
        var pat = smokePatterns[key], k = L[1] / L[0].width;
        pat.setTransform(new DOMMatrix([k, 0, 0, k, (tS * L[2]) % L[1], -(tS * L[3]) % L[1]]));
        g.globalAlpha = alphas[n];
        g.fillStyle = pat;
        g.fillRect(0, 0, w, h);
      });
      g.globalAlpha = 1;
    }

    function makeNoise(size, period, seedShift) {
      var c = document.createElement("canvas");
      c.width = c.height = size;
      var g = c.getContext("2d"), img = g.createImageData(size, size), grids = [];
      for (var o = 0; o < 4; o++) {
        var P = period * Math.pow(2, o), grid = [];
        for (var i = 0; i < P * P; i++) grid.push(Math.random());
        grids.push({ P: P, grid: grid, amp: Math.pow(0.5, o) });
      }
      for (var y = 0; y < size; y++) {
        for (var x = 0; x < size; x++) {
          var v = 0, total = 0;
          grids.forEach(function (gr) {
            var u = x / size * gr.P, w = y / size * gr.P, i = Math.floor(u), j = Math.floor(w);
            var fx = u - i, fy = w - j; fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
            var P = gr.P, G = gr.grid;
            var a = G[(j % P) * P + (i % P)], b = G[(j % P) * P + ((i + 1) % P)];
            var cc = G[((j + 1) % P) * P + (i % P)], d = G[((j + 1) % P) * P + ((i + 1) % P)];
            v += (a + (b - a) * fx + (cc - a) * fy + (a - b - cc + d) * fx * fy) * gr.amp;
            total += gr.amp;
          });
          v = Math.max(0, Math.min(1, (v / total - 0.32) / 0.4));
          var p = (y * size + x) * 4;
          img.data[p] = 128; img.data[p + 1] = 128; img.data[p + 2] = 128;  // only its shape is used
          img.data[p + 3] = Math.pow(v, 1.4) * 255;
        }
      }
      g.putImageData(img, 0, 0);
      return c;
    }

    // ---------- Things that move ----------
    var waveC, waveX, puffC, glowDot, boltCut, drags, loopC, loopX, backC, backX, frontC, frontX, base, fogC, fogX, fogMask, fogTint, noiseA, noiseB, smokeC, smokeX, fullC, fullX, fullMask, softC, softX, softMask;
    var birds = [], glitter = [], motes = [], grains = [], gold = [], foam = [], swells = [];
    var swirlC, swirlX, swirlAt = -1, fullDensity, markedDensity, clearNow = 0, skyFill, sandFill, sideL, sideR, chaosC, chaosX, chaosSmoke, chaosSX, chaosTint, chaosMask;
    var PAD = 800;            // how far the chaos fog reaches past the picture's left and right edges
    // 0 = no fog here, 1 = thick fog. x, y are in the sky; fish use the spot of their bird.
    function fogAt(x, y) {
      var fx = Math.max(0, Math.min(fogC.width - 1, Math.round(x / 8)));
      var fy = Math.max(0, Math.min(fogC.height - 1, Math.round(y / 8)));
      var i = (fy * fogC.width + fx) * 4 + 3;
      return (fullDensity[i] / 255) * (1 - clearNow) + (markedDensity[i] / 255) * clearNow;
    }
    var nextFlash = CLEAR_AT, flashAt = -10, flashPower = 1, t0 = null;

    function start() {
      // 1. Bake the extra sand texture into the background once
      base = document.createElement("canvas");
      base.width = IW; base.height = IH;
      var b = base.getContext("2d");
      b.drawImage(bg, 0, 0);
      b.save();
      sandPath(b);
      b.clip();
      // clumps: soft darker patches
      var clump = makeNoise(128, 6);
      b.globalAlpha = 0.1;
      b.globalCompositeOperation = "multiply";
      for (var cx = 0; cx < IW; cx += 192) for (var cy = 1400; cy < IH; cy += 192) b.drawImage(clump, cx, cy, 192, 192);
      b.globalCompositeOperation = "source-over";
      b.globalAlpha = 1;
      // pebbles: lit on the side facing the light, shaded on the other side
      for (var i = 0; i < 900; i++) {
        var px = rand(0, IW), py = rand(1430, IH);
        if (py < shoreY(px) + 8) continue;
        var r = rand(1.2, 4.2) * (0.6 + (py - 1430) / 600);
        b.fillStyle = "rgba(40, 30, 22, 0.35)";
        b.beginPath(); b.ellipse(px + r * 0.5, py + r * 0.4, r, r * 0.7, 0, 0, 7); b.fill();
        var tone = Math.random() < 0.5 ? "150, 120, 95" : "175, 165, 155";
        b.fillStyle = "rgba(" + tone + ", 0.9)";
        b.beginPath(); b.ellipse(px, py, r, r * 0.7, 0, 0, 7); b.fill();
        b.fillStyle = "rgba(255, 240, 215, 0.45)";
        b.beginPath(); b.ellipse(px - r * 0.3, py - r * 0.25, r * 0.4, r * 0.28, 0, 0, 7); b.fill();
      }
      b.restore();

      // 2. Fog: smoke layers, kept inside the marked areas
      noiseA = makeNoise(256, 3);
      noiseB = makeNoise(256, 5);
      fogC = document.createElement("canvas");
      fogC.width = Math.round(IW / 8); fogC.height = Math.round(IH / 8);
      fogX = fogC.getContext("2d");
      // The fog only lives inside the two areas you marked in red. Everything else stays clear.
      var FOG_LEFT = [[0, 0], [380, 0], [500, 160], [560, 290], [591, 388], [543, 432], [506, 477], [452, 521], [397, 543], [326, 566],
                      [271, 588], [217, 632], [185, 677], [158, 721], [108, 766], [50, 810], [0, 835]];
      var FOG_RIGHT = [[1300, 0], [1180, 140], [1120, 290], [1101, 432], [1198, 477], [1291, 521], [1365, 566], [1441, 610], [1502, 655],
                       [1559, 699], [1600, 744], [1654, 788], [1695, 833], [1726, 877], [1752, 922], [1780, 966],
                       [1819, 1011], [1865, 1055], [1906, 1100], [1938, 1144], [1980, 1189], [2032, 1233],
                       [2080, 1278], [2155, 1322], [2253, 1367], [2421, 1385], [2421, 0]];
      var tiny = document.createElement("canvas");                 // drawn small, then stretched: soft edges
      tiny.width = Math.round(IW / 80); tiny.height = Math.round(IH / 80);
      var tm = tiny.getContext("2d");
      tm.fillStyle = "#000";
      [FOG_LEFT, FOG_RIGHT].forEach(function (area) {
        tm.beginPath();
        area.forEach(function (pt, n) { if (n === 0) tm.moveTo(pt[0] / 80, pt[1] / 80); else tm.lineTo(pt[0] / 80, pt[1] / 80); });
        tm.closePath();
        tm.fill();
      });
      fogMask = document.createElement("canvas");
      fogMask.width = fogC.width; fogMask.height = fogC.height;
      var fm = fogMask.getContext("2d");
      fm.drawImage(tiny, 0, 0, fogMask.width, fogMask.height);
      fm.globalCompositeOperation = "destination-out";          // the fog melts away softly near the light
      fm.save();
      fm.translate(LIGHT_X / 8, 0);
      fm.scale(1, 1.6);
      var melt = fm.createRadialGradient(0, 0, 0, 0, 0, 75);
      melt.addColorStop(0, "rgba(0,0,0,1)");
      melt.addColorStop(0.5, "rgba(0,0,0,0.6)");
      melt.addColorStop(1, "rgba(0,0,0,0)");
      fm.fillStyle = melt;
      fm.fillRect(-80, -10, 160, 100);
      fm.restore();

      // the fog takes its colors from your art: a very soft copy of the picture's own dark parts
      var soft = document.createElement("canvas");

      c.translate(LEAF_BASE[0], LEAF_BASE[1]);
      c.rotate(sway * 0.9);
      c.scale((1 + 0.03 * Math.sin(t * 0.4) + flash * 0.06) * (0.92 + 0.08 * clear) * leafSize, 1);
      if (clear < 1) {                                  // in the fog the shadow is soft and spread out
        c.globalAlpha = 0.22 * (1 - clear);
        for (var sb = 0; sb < 4; sb++) {
          var ox = (sb % 2 ? 1 : -1) * 4, oy = (sb < 2 ? 1 : -1) * 3;
          c.drawImage(shadow, SHADOW_AT[0] - LEAF_BASE[0] + ox, SHADOW_AT[1] - LEAF_BASE[1] + oy);
        }
      }
      c.globalAlpha = Math.min(1, (0.85 + 0.15 * flash) * sunShadow);
      c.drawImage(shadow, SHADOW_AT[0] - LEAF_BASE[0], SHADOW_AT[1] - LEAF_BASE[1]);
      c.restore();
      var boltShadow = since > -0.1 ? flashLevel(t) * flashPower : 0;   // the strike throws a long, sharp shadow away from the bolt
      if (boltShadow > 0.02) {
        c.save();
        c.translate(LEAF_BASE[0], LEAF_BASE[1]);
        c.rotate(sway * 0.9 - 0.05);
        c.scale(1.5 + 0.4 * boltShadow, 0.85);
        c.globalAlpha = Math.min(0.7, 0.45 * boltShadow);
        c.drawImage(shadow, SHADOW_AT[0] - LEAF_BASE[0], SHADOW_AT[1] - LEAF_BASE[1]);
        c.restore();
      }

      c.globalCompositeOperation = "screen";            // a living glow around the leaf
      var haloR = 150 * (1 + 0.6 * Math.min(1, flash));   // the glow swells with the strike
      var halo = c.createRadialGradient(1509, 1598, 0, 1509, 1598, haloR);
      halo.addColorStop(0, "rgba(180, 240, 160, " + (0.3 + 0.1 * breath + 0.3 * LEAF_REACT * flash + 0.7 * tapGlow + (ts > 0 ? 0.6 * Math.exp(-ts * 2.5) : 0)) + ")");
      halo.addColorStop(1, "rgba(180, 240, 160, 0)");
      c.fillStyle = halo;
      c.fillRect(1509 - haloR, 1598 - haloR, haloR * 2, haloR * 2);
      c.globalCompositeOperation = "source-over";

      c.save();                                       // the leaf breathes and sways from its stem
      c.translate(LEAF_BASE[0], LEAF_BASE[1]);
      c.rotate(sway);
      c.scale((1 + 0.02 * breath) * leafSize, (1 + 0.035 * breath) * leafSize);
      c.drawImage(leaf, LEAF_AT[0] - LEAF_BASE[0], LEAF_AT[1] - LEAF_BASE[1]);
      c.globalCompositeOperation = "lighter";
      c.globalAlpha = Math.min(1, 0.12 + 0.1 * breath + 0.3 * flash + 0.6 * tapGlow);
      c.drawImage(leaf, LEAF_AT[0] - LEAF_BASE[0], LEAF_AT[1] - LEAF_BASE[1]);
      c.restore();

      // tiny lights rising from the leaf toward the sky
      if (Math.random() < 0.12) motes.push({ x: rand(1490, 1530), y: rand(1560, 1630), born: t, life: rand(2.5, 4.5), dx: rand(-14, 4) });
      c.globalCompositeOperation = "lighter";
      motes = motes.filter(function (mt) {
        var age = (t - mt.born) / mt.life;
        if (age > 1) return false;
        var a = Math.sin(age * Math.PI) * 0.8;
        c.fillStyle = "rgba(215, 255, 185, " + a + ")";
        c.beginPath();
        c.arc(mt.x + mt.dx * age * 4 + Math.sin(age * 9) * 4, mt.y - age * 120, 1.8, 0, 7);
        c.fill();
        return true;
      });
      c.globalCompositeOperation = "source-over";
      c.globalAlpha = 1;

      // --- Arriving: the cyan light from Abundance fades away ---
      var arrive = 1 - smooth((t - 0.5) / 2.8);
      if (arrive > 0) {
        c.setTransform(dpr, 0, 0, dpr, 0, 0);
        var land = c.createRadialGradient(W / 2, H, 0, W / 2, H, Math.max(W, H));
        land.addColorStop(0, "#ffffff");
        land.addColorStop(0.35, "#e6fdff");
        land.addColorStop(0.7, "#7aeaff");
        land.addColorStop(1, "#22c8f0");
        c.globalAlpha = arrive;
        c.fillStyle = land;
        c.fillRect(0, 0, W, H);
        c.globalAlpha = 1;
      }

      requestAnimationFrame(frame);
    }
  </script>
</body>
</html>
