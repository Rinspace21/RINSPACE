<!Doctype html>
<html>
    <head>
        <title>Rinspace</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
 <svg class="forest" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMax slice">
  <defs>
    <filter id="blur-far">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <filter id="blur-near">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
      <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.45" />
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0.12" />
    </linearGradient>
</defs>
  <g fill="#1d5c63" opacity="0.35" filter="url(#blur-far)">
    <polygon points="-15,560 30,-20 75,560" />
    <polygon points="65,560 110,-60 155,560" />
    <polygon points="145,560 190,10 235,560" />
    <polygon points="225,560 270,-40 315,560" />
    <polygon points="305,560 350,30 395,560" />
    <polygon points="605,560 650,40 695,560" />
    <polygon points="805,560 850,-30 895,560" />
    <polygon points="885,560 930,-50 975,560" />
    <polygon points="965,560 1010,0 1055,560" />
  </g>
  <g fill="#0c2a2e" opacity="0.75" filter="url(#blur-near)">
    <polygon points="0,560 60,20 120,560" />
    <polygon points="160,560 220,60 280,560" />
    <polygon points="290,560 340,90 390,560" />
    <polygon points="620,560 670,120 720,560" />
    <polygon points="780,560 840,10 900,560" />
    <polygon points="900,560 960,40 1020,560" />
  </g>
  <ellipse cx="#ffd98a" cy="0" rx="60" ry="30" fill="#fff6d5" opacity="0.35" filter="url(#blur-far)" />
  <polygon points="690,0 750,0 560,560 450,560" fill="url(#light)" filter="url(#blur-far)" />
  <ellipse cx="#ffd98a" cy="560" rx="80" ry="14" fill="#fff6d5" opacity="0.3" filter="url(#blur-far)" />
  <rect x="0" y="560" width="1000" height="40" fill="#1c1410" />
</svg>
<div class="ground"></div>       
        <h1>Rinspace</h1>
        <p>Everything comes with a story.</p>
        <svg class="plant" viewBox="0 150 300 200">
<path class="stem" d="M150 350 Q130 280 150 200" stroke="#3a7d44" stroke-width="6" fill="none" pathLength="100" />
<g class="crumbs">
  <ellipse cx="150" cy="#1c1410" rx="14" ry="4" fill="#3a2419" />
  <circle cx="134" cy="346" r="2.5" fill="#2b1a12" />
  <circle cx="165" cy="345" r="2" fill="#2b1a12" />
  <circle cx="141" cy="342" r="1.5" fill="#2b1a12" />
  <circle cx="160" cy="341" r="1.5" fill="#2b1a12" />
</g>
<g transform="translate(142 307) rotate(200)">
  <g class="leaf leaf-bottom" fill="#4caf50">
    <path d="M0 0 Q25 -14 50 0 Q25 14 0 0 Z" />
    <path d="M2 0 L46 0" fill="none" stroke="#2e7d32" stroke-width="1.2" />
  </g>
</g>
<g transform="translate(142 247) rotate(-25)">
  <g class="leaf leaf-middle" fill="#4caf50">
    <path d="M0 0 Q25 -14 50 0 Q25 14 0 0 Z" />
    <path d="M2 0 L46 0" fill="none" stroke="#2e7d32" stroke-width="1.2" />
  </g>
</g>
<g transform="translate(150 200) rotate(-75)">
  <g class="leaf leaf-top" fill="#4caf50">
    <path d="M0 0 Q25 -14 50 0 Q25 14 0 0 Z" />
    <path d="M2 0 L46 0" fill="none" stroke="#2e7d32" stroke-width="1.2" />
  </g>
</g>
</svg>
    </body>
    </html>
