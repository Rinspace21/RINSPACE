<!Doctype html>
<html>
    <head>
        <title>Rinspace</title>
    <link rel="stylesheet" href="style.css">
    </head>
    <body>
 <svg class="forest" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMax slice">
  <defs>
    <filter id="blur-far">
      <feGaussianBlur stdDeviation="4" />
    </filter>
    <filter id="blur-near">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
      <linearGradient id="light" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.45" />
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0.12" />
    </linearGradient>
</defs>
  <g fill="#1d5c63" opacity="0.35" filter="url(#blur-far)">
    <polygon points="-15,560 30,-20 75,560" />
    <polygon points="65,560 110,-60 155,560" />
    <polygon points="145,560 190,10 235,560" />
    <polygon points="225,560 270,-40 315,560" />
    <polygon points="305,560 350,30 395,560" />
    <polygon points="605,560 650,40 695,560" />
    <polygon points="805,560 850,-30 895,560" />
    <polygon points="885,560 930,-50 975,560" />
    <polygon points="965,560 1010,0 1055,560" />
  </g>
  <g fill="#0c2a2e" opacity="0.75" filter="url(#blur-near)">
    <polygon points="0,560 60,20 120,560" />
    <polygon points="160,560 220,60 280,560" />
    <polygon points="290,560 340,90 390,560" />
    <polygon points="620,560 670,120 720,560" />
    <polygon points="780,560 840,10 900,560" />
    <polygon points="900,560 960,40 1020,560" />
  </g>
  <ellipse cx="720" cy="0" rx="60" ry="30" fill="#ffd98a" opacity="0.35" filter="url(#blur-far)" />
  <ellipse cx="505" cy="560" rx="80" ry="14" fill="#ffd98a" opacity="0.3" filter="url(#blur-far)" />
  <rect x="0" y="560" width="1000" height="40" fill="#1c1410" />
</svg>
<div class="ground"></div>       
        <h1>Rinspace</h1>
        <p>Everything comes with a story.</p>
        <svg class="plant" viewBox="425 20 560 660">
  <defs>
    <linearGradient id="leafShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc46a" />
      <stop offset="1" stop-color="#2f7a3a" />
    </linearGradient>
    <linearGradient id="stemShade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f6b35" />
      <stop offset="1" stop-color="#6fae5a" />
    </linearGradient>
    <linearGradient id="frameLight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.15" />
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0.45" />
    </linearGradient>
        <linearGradient id="beamLight" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd98a" stop-opacity="0.04" />
      <stop offset="1" stop-color="#ffd98a" stop-opacity="0.22" />
    </linearGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>
  <polygon class="frame-light" points="975,35 1490,-600 1757,-600 975,365" fill="url(#light)" filter="url(#blur-far)" opacity="0.8"/>
  <polygon class="frame-light" points="425,680 975,35 975,365 727,680" fill="url(#frameLight)" filter="url(#soft)" />
    <g class="dust">
    <circle cx="600" cy="560" r="2" />
    <circle cx="560" cy="640" r="1.5" />
    <circle cx="610" cy="630" r="2.5" />
    <circle cx="680" cy="430" r="2" />
    <circle cx="650" cy="520" r="1.5" />
    <circle cx="790" cy="300" r="2.5" />
    <circle cx="820" cy="450" r="1.5" />
    <circle cx="850" cy="520" r="2" />
    <circle cx="880" cy="200" r="1.5" />
    <circle cx="930" cy="330" r="2.5" />
    <circle cx="910" cy="410" r="2" />
    <circle cx="1000" cy="180" r="1.5" />
    <circle cx="1040" cy="60" r="2" />
    <circle cx="1020" cy="120" r="1.5" />
    <circle cx="1100" cy="-40" r="2" />
    <circle cx="1150" cy="-150" r="1.5" />
  </g>

  <g class="sway">
  <path class="stem" d="M705 680 C700 600 712 540 705 470 C698 400 714 330 705 270" stroke="url(#stemShade)" stroke-width="9" fill="none" pathLength="100" />
  <path class="twig twig-eye" d="M707 345 Q722 352 737 372" stroke="#3a7d44" stroke-width="4" fill="none" pathLength="100" />
  <path class="twig twig-lip" d="M704 560 C730 556 758 562 762 588 M762 588 C788 580 794 548 776 542 C762 538 760 556 771 556" stroke="#3a7d44" stroke-width="3" fill="none" pthLength="100" />

  <g transform="translate(762 588) rotate(180) scale(4 3.2)">
    <g class="leaf leaf-bottom" fill="url(#leafShade)">
      <path d="M0 0 Q25 -14 50 0 Q25 14 0 0 Z" />
      <path d="M2 0 L46 0" fill="none" stroke="#2e7d32" stroke-width="1.2" vector-effect="non-scaling-stroke" />
    </g>
  </g>
  <g transform="translate(737 372) rotate(-6) scale(4.1 4.3)">
    <g class="leaf leaf-middle" fill="url(#leafShade)">
      <path d="M0 0 Q25 -14 50 0 Q25 14 0 0 Z" />
      <path d="M2 0 L46 0" fill="none" stroke="#2e7d32" stroke-width="1.2" vector-effect="non-scaling-stroke" />
    </g>
  </g>
  <g transform="translate(705 270) rotate(-90) scale(4 8)">
    <g class="leaf leaf-top" fill="url(#leafShade)">
      <path class="half half-a" d="M0 0 Q25 -14 50 0 Z" />
      <path class="half half-b" d="M0 0 Q25 14 50 0 Z" />
      <path d="M2 0 L46 0" fill="none" stroke="#2e7d32" stroke-width="1.2" vector-effect="non-scaling-stroke" />
    </g>
  </g>

    </g>
  <g class="crumbs">
    <ellipse cx="705" cy="680" rx="40" ry="10" fill="#1c1410" />
    <circle cx="680" cy="672" r="6" fill="#2b1a12" />
    <circle cx="735" cy="670" r="5" fill="#2b1a12" />
    <circle cx="694" cy="662" r="4" fill="#2b1a12" />
    <circle cx="722" cy="660" r="4" fill="#2b1a12" />
  </g>
</svg>
    </body>
